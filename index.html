<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los momentos que guardo contigo</title>

<style>

/* ================================================= */
/* ESTILOS GENERALES */
/* ================================================= */

:root{
    --papel:#fff9ed;
    --tinta:#42352e;
    --rosa:#995b63;
    --oro:#cba974;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#e8dfd4;
    color:var(--tinta);
    font-family:Georgia,serif;
    min-height:100svh;

    background-image:
        radial-gradient(
            ellipse at top,
            #fffaf1,
            transparent 70%
        );
}

main{
    max-width:850px;
    margin:auto;
    padding:30px 18px;
}

header{
    text-align:center;
    font:11px Arial,sans-serif;
    letter-spacing:4px;
    margin:10px 0 25px;
    color:#73665d;
}

.libro{
    position:relative;
    background:var(--papel);
    border-radius:5px 16px 16px 5px;
    border:1px solid #d8c7ac;

    box-shadow:
        8px 8px 0 #dfd1bb,
        12px 12px 0 #cdbda7,
        0 25px 60px #42352e22;

    overflow:hidden;
}

.libro:before{
    content:"";
    position:absolute;
    left:12px;
    top:0;
    bottom:0;
    width:1px;
    background:#c8b59955;
    z-index:1;
}

.pagina{
    padding:34px 30px 28px;
    text-align:center;
    min-height:530px;
    animation:entrada .45s ease;
    transform-origin:left center;
}

[hidden]{
    display:none!important;
}


/* ================================================= */
/* PORTADA */
/* ================================================= */

.portada{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:#6d3e49;
    color:#fff3df;

    min-height:580px;

    border:12px double #c9a37b;
}

.sello{
    font-size:45px;
    color:var(--oro);
}

.etiqueta{
    font:11px Arial,sans-serif;
    letter-spacing:3px;
    text-transform:uppercase;
    margin:20px 0;
}

h1{
    font-size:clamp(38px,8vw,66px);
    font-weight:normal;
    line-height:1.08;
    max-width:550px;
    margin:15px auto;
}

h2{
    font-size:clamp(28px,5vw,40px);
    font-weight:normal;
    margin:15px 0;
}

p{
    line-height:1.7;
    white-space:pre-line;
    font-size:17px;
    max-width:560px;
    margin:16px auto;
}

button{
    border:0;
    border-radius:30px;
    padding:14px 22px;

    background:var(--rosa);
    color:white;

    cursor:pointer;

    font:15px Arial,sans-serif;

    min-height:46px;
}

button:hover{
    filter:brightness(1.1);
}

button:focus-visible{
    outline:3px solid #d2a84e;
    outline-offset:4px;
}

button:disabled{
    opacity:.4;
    cursor:default;
}

.portada button{
    background:#f9ead2;
    color:#633c44;
    margin-top:20px;
}


/* ================================================= */
/* MARCO DE LA FOTO */
/* ================================================= */

.polaroid{

    background:#fff;

    padding:12px 12px 28px;

    box-shadow:
        0 15px 38px #35000c99;

    width:100%;

    max-width:560px;

    margin:22px auto;

    /* IMPORTANTE:
       Marco completamente derecho */
    transform:rotate(0deg);

    /* Oculto mientras carga */
    opacity:0;
    visibility:hidden;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}


/*
   Cuando la foto ya está lista
*/
.polaroid.lista{

    opacity:1;

    visibility:visible;

}


/* ================================================= */
/* FOTO */
/* ================================================= */

.polaroid img{

    display:block;

    width:100%;

    aspect-ratio:4/3;

    object-fit:cover;

    object-position:center center;

    margin:0 auto;

    background:#eee;

    transform:none;

}


/* ================================================= */
/* ILUSTRACIÓN DE RESPALDO */
/* ================================================= */

.ilustracion{

    aspect-ratio:4/3;

    display:grid;

    place-content:center;

    background:
        linear-gradient(
            150deg,
            #d8d6c8,
            #f2dcc9
        );

    color:#71695f;

    font-size:72px;

}


/* ================================================= */
/* PIE DE FOTO */
/* ================================================= */

.pie-foto{

    font-style:italic;

    font-size:14px;

    margin:12px 0 0;

}


/* ================================================= */
/* OTROS ELEMENTOS */
/* ================================================= */

nav{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-top:30px;

}

#contador{

    font:12px Arial,sans-serif;

    color:#75675b;

    text-align:center;

}

.nota{

    text-align:center;

    color:#887b71;

    font:12px Arial,sans-serif;

    margin:25px 0;

}

.secreto{

    padding:20px;

    border:1px dashed var(--oro);

    border-radius:8px;

    margin-top:20px;

    background:#f4e9d9;

}

.numero{

    font:11px Arial,sans-serif;

    color:#a79279;

    letter-spacing:2px;

    margin-top:28px;

}


/* ================================================= */
/* ANIMACIÓN DEL LIBRO */
/* ================================================= */

@keyframes entrada{

    from{

        opacity:0;

        transform:
            perspective(900px)
            rotateY(-8deg);

    }

    to{

        opacity:1;

        transform:none;

    }

}


/* ================================================= */
/* RESPONSIVE */
/* ================================================= */

@media(max-width:520px){

    main{

        padding:18px 14px;

    }

    .pagina{

        padding:26px 18px;

        min-height:530px;

    }

    .portada{

        min-height:550px;

    }

    nav button{

        padding:12px 15px;

    }

}


@media(prefers-reduced-motion:reduce){

    .pagina{

        animation:none;

    }

}


/* ================================================= */
/* INTRODUCCIÓN */
/* ================================================= */

.inicio{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:9999;

    background:

        radial-gradient(
            circle at 50% 15%,
            #df4864 0,
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #a71535,
            #4a0717
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;

}

.inicio.oculto{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}

.inicio-tarjeta{

    width:min(90%,650px);

    padding:55px 30px;

    text-align:center;

    border:1px solid #fff;

    border-radius:20px;

    background:#6c0b20d9;

    box-shadow:

        0 25px 80px #210008a8,

        inset 0 0 45px #ffffff12;

}

.inicio-corazon{

    font-size:65px;

    color:#ffd4dc;

    display:block;

    animation:
        latido 1.5s infinite;

}

.inicio h1{

    color:#fff;

}

.inicio p{

    color:#fff;

}

.inicio .etiqueta{

    color:#fff;

}

.inicio button{

    background:#fff;

    color:#8b1430;

    margin-top:20px;

}


/* ================================================= */
/* PROGRESO */
/* ================================================= */

.progreso{

    height:5px;

    margin-top:22px;

    border-radius:10px;

    overflow:hidden;

    background:#ffffff3d;

}

.progreso span{

    display:block;

    height:100%;

    width:0;

    background:#fff;

    transition:
        width .5s ease;

}


/* ================================================= */
/* BOTONES DE SONIDO */
/* ================================================= */

.sonido{

    color:#fff;

    border:1px solid #ffffff70;

    background:#ffffff10;

    margin:5px;

}


/* ================================================= */
/* PARTÍCULAS */
/* ================================================= */

.particulas{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:2;

}

.particulas span{

    position:absolute;

    top:100%;

    color:#ffffff38;

    font-size:25px;

    animation:
        flotar 16s linear infinite;

}


/* ================================================= */
/* DESTELLOS FINALES */
/* ================================================= */

.destello{

    position:fixed;

    left:50%;

    top:50%;

    font-size:25px;

    pointer-events:none;

    z-index:10000;

    animation:
        confeti 1.9s ease-out forwards;

}


/* ================================================= */
/* ANIMACIÓN DE FOTO */
/* ================================================= */

/*
   Todas las fotos utilizan la misma animación.

   Esto evita:
   - giros
   - inclinaciones
   - desplazamientos laterales

   La foto aparece centrada y derecha.
*/

.foto-centro,
.foto-lateral,
.foto-cortina,
.foto-giro,
.foto-album{

    display:block;

    width:100%;

    aspect-ratio:4/3;

    object-fit:cover;

    object-position:center center;

    margin:0 auto;

    transform:none;

    animation:
        aparecerFoto 1s ease-out both;

}


/* ================================================= */
/* APARICIÓN DE LA FOTO */
/* ================================================= */

@keyframes aparecerFoto{

    from{

        opacity:0;

        transform:scale(.96);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}


/* ================================================= */
/* CORAZÓN */
/* ================================================= */

@keyframes latido{

    0%,100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.15);

    }

}


/* ================================================= */
/* PARTÍCULAS FLOTANTES */
/* ================================================= */

@keyframes flotar{

    from{

        transform:
            translateY(0)
            rotate(0deg);

        opacity:0;

    }

    15%{

        opacity:1;

    }

    85%{

        opacity:1;

    }

    to{

        transform:
            translateY(-120vh)
            rotate(360deg);

        opacity:0;

    }

}


/* ================================================= */
/* CONFETI */
/* ================================================= */

@keyframes confeti{

    from{

        opacity:1;

        transform:
            translate(0,0)
            scale(1);

    }

    to{

        opacity:0;

        transform:
            translate(var(--dx),var(--dy))
            scale(.3)
            rotate(360deg);

    }

}


/* ================================================= */
/* TEMA ROJO ROMÁNTICO */
/* ================================================= */

:root{

    --papel:#8f1028;

    --tinta:#fff;

    --rosa:#fff;

    --oro:#ffd4dc;

}

body{

    color:#fff;

    background:#650b1d;

    background-image:

        radial-gradient(
            circle at 15% 5%,
            #d94560 0,
            transparent 36%
        ),

        radial-gradient(
            circle at 90% 90%,
            #a91535 0,
            transparent 42%
        ),

        linear-gradient(
            145deg,
            #8f1028,
            #420815
        );

}

header{

    color:#fff;

    text-shadow:
        0 2px 8px #35000c;

}

.libro{

    background:#99152f;

    border:1px solid #ffb9c7;

    box-shadow:

        8px 8px 0 #740d23,

        12px 12px 0 #4d0717,

        0 30px 80px #21000888;

}

.libro:before{

    background:#ffcad466;

}

.pagina{

    color:#fff;

    background:

        radial-gradient(
            circle at 85% 10%,
            #d13a56 0,
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #a71634,
            #6f0c22
        );

}

.pagina h2,
.pagina p,
.pagina .numero{

    color:#fff;

    text-shadow:
        0 2px 6px #3d0613;

}

.pagina .etiqueta{

    color:#ffe5ea;

    text-shadow:
        0 2px 6px #3d0613;

}

.portada{

    background:

        radial-gradient(
            circle at 20% 12%,
            #e04c67 0,
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #aa1838,
            #59091c
        );

    border-color:#ffd2da;

}

.secreto{

    color:#fff!important;

    background:#ffffff18;

    border-color:#ffd2da;

}

#contador,
.nota{

    color:#fff;

    text-shadow:
        0 2px 6px #35000c;

}

.particulas span{

    color:#ffffff38;

}


/* ================================================= */
/* MARCO SIEMPRE RECTO */
/* ================================================= */

.polaroid{

    transform:rotate(0deg) !important;

}


/* ================================================= */
/* FOTO SIEMPRE CENTRADA */
/* ================================================= */

.polaroid img{

    transform:none !important;

    object-position:center center !important;

}


/* ================================================= */
/* ANIMACIÓN DE FOTO SIN ROTACIÓN */
/* ================================================= */

.foto-centro,
.foto-lateral,
.foto-cortina,
.foto-giro,
.foto-album{

    transform:none;

}


/* ================================================= */
/* REDUCCIÓN DE MOVIMIENTO */
/* ================================================= */

@media(prefers-reduced-motion:reduce){

    .foto-centro,
    .foto-lateral,
    .foto-cortina,
    .foto-giro,
    .foto-album{

        animation:none;

    }

}

</style>
</head>


<body>


<!-- ================================================= -->
<!-- PANTALLA DE INICIO -->
<!-- ================================================= -->

<div class="inicio" id="inicio">

    <div class="inicio-tarjeta">

        <span
            class="inicio-corazon"
            aria-hidden="true">
            ♥
        </span>

        <div class="etiqueta">
            Una sorpresa hecha para ti
        </div>

        <h1>
            Los momentos que guardo contigo
        </h1>

        <button id="abrir">
            Abrir nuestra historia
        </button>

    </div>

</div>


<!-- ================================================= -->
<!-- PARTICULAS -->
<!-- ================================================= -->

<div
    class="particulas"
    id="particulas"
    aria-hidden="true">
</div>


<!-- ================================================= -->
<!-- MÚSICA -->
<!-- ================================================= -->

<audio
    id="musica"
    loop
    autoplay
    preload="auto">

    <source
        src="cancion.mp3"
        type="audio/mpeg">

</audio>


<main>

    <p
        id="estadoMusica"
        role="status"
        style="font:13px Arial,sans-serif;text-align:center">
    </p>


    <header>
        HECHO DE PEQUEÑOS GRANDES MOMENTOS
    </header>


    <!-- ================================================= -->
    <!-- LIBRO -->
    <!-- ================================================= -->

    <div
        class="libro"
        id="libro">


        <!-- PORTADA -->

        <section
            class="pagina portada"
            id="portada"
            aria-label="Portada">

            <div
                class="sello"
                aria-hidden="true">
                ✧
            </div>

            <div class="etiqueta">
                Una historia para guardar
            </div>

            <h1 id="titulo"></h1>

            <p id="dedicatoria"></p>

            <p class="etiqueta">
                Nuestra historia está por comenzar…
            </p>

        </section>


        <!-- ================================================= -->
        <!-- PÁGINA DE CONTENIDO -->
        <!-- ================================================= -->

        <section
            class="pagina"
            id="contenido"

            aria-label="Página del libro">


            <div
                class="etiqueta"
                id="fecha">
            </div>


            <h2
                id="encabezado"
                tabindex="-1">
            </h2>


            <!-- ================================================= -->
            <!-- MARCO -->
            <!-- ================================================= -->

            <figure
                class="polaroid cargando"
                id="marco">


                <img
                    id="foto"
                    alt=""
                    hidden>


                <div
                    class="ilustracion"
                    id="ilustracion"
                    aria-hidden="true">

                </div>


                <figcaption
                    class="pie-foto"
                    id="pie">
                </figcaption>


            </figure>


            <p id="texto"></p>


            <button
                id="revelar"
                hidden>
                Hay algo más para ti… 💌
            </button>


            <p
                id="secreto"
                class="secreto"
                hidden>
            </p>

                class="numero"
                id="numero">

    <!-- ================================================= -->

    <!-- ================================================= -->

    <div
        class="progreso"
        aria-hidden="true">

        <span id="avance"></span>

    </div>


    <!-- ================================================= -->
    <!-- CONTROLES -->
    <!-- ================================================= -->

    <div
        style="text-align:center;margin-top:22px">

        <span
            id="contador"
            role="status"
            aria-live="polite">
            Portada
        </span>

        <br>


        <button
            class="sonido"
            id="pausar">
            Pausar recorrido
        </button>


        <button
            class="sonido"
            id="reiniciar"
            hidden>
            Volver a ver nuestra historia ↺
        </button>

    </div>


    <button
        class="sonido"
        id="silenciar"
        hidden
        aria-pressed="false">

        Silenciar sonido

    </button>


    <p class="nota">

    </p>


    <noscript>
        Activa JavaScript en tu navegador para abrir el libro.
    </noscript>


</main>


<script>

/* ================================================= */
/* CONFIGURACIÓN */
/* ================================================= */

const CONFIG = {

    segundosPortada:4,

    segundosPorPagina:9,

    titulo:
        "Los momentos que guardo contigo",

    dedicatoria:
        "Hay recuerdos que merecen su propio libro. Este es el nuestro.",

    sorpresa:
        "Lo mejor de nuestra historia es que todavía nos quedan muchas páginas por escribir. Gracias por ser parte de mi vida. ♥",

    recuerdos:[

        {
            fecha:"El comienzo",

            titulo:"Donde empezó todo",

            foto:"foto1.png",

            descripcion:
                "Nuestra primera foto juntos",

            pie:
                "Un instante, muchas sonrisas.",

            texto:
                "Quizás ese día no imaginábamos cuántos recuerdos vendrían después. Hoy lo guardo como uno de mis favoritos."
        },


        {
            fecha:"Un día especial",

            titulo:"Nuestra pequeña aventura",

            foto:"foto2.png",

            descripcion:
                "Una aventura compartida",

            pie:
                "El mejor destino: compartirlo contigo.",

            texto:
                "No fue solo el lugar. Fueron las conversaciones, las risas y esa manera de convertir un día cualquiera en algo especial."
        },


        {
            fecha:"Siempre en mi memoria",

            titulo:"Las cosas más sencillas",

            foto:"foto3.png",

            descripcion:
                "Un momento que queremos recordar",

            pie:
                "De esos días que dan ganas de repetir.",

            texto:
                "A veces la felicidad cabe en una foto, en una conversación larga o en una risa que no se puede contener."
        },


        {
            fecha:"Una aventura al atardecer",

            titulo:"Donde el cielo guardó este momento",

            foto:"foto4.png",

            descripcion:
                "Un paseo a caballo durante el atardecer",

            pie:
                "Un atardecer que siempre querré recordar.",

            texto:
                "El cielo cambió de colores y el tiempo pareció detenerse. Hay paisajes hermosos, pero los recuerdos son los que les dan un significado especial."
        },


        {
            fecha:"Un momento para nosotros",

            titulo:"Juntos, todo se siente especial",

            foto:"foto5.png",

            descripcion:
                "Un recuerdo de los dos juntos",

            pie:
                "Contigo, hasta lo cotidiano se vuelve inolvidable.",

            texto:
                "No importa el lugar ni el momento. Cuando estamos juntos, siempre aparece una razón para sonreír y guardar una nueva página en nuestra historia."
        }

    ]

};


/* ================================================= */
/* ELEMENTOS */
/* ================================================= */

const $ =
    id => document.getElementById(id);


let pagina = 0;

const total =
    CONFIG.recuerdos.length + 1;


/* ================================================= */
/* PRECARGA DE LAS FOTOS */
/* ================================================= */

/*
    Las cinco fotos empiezan a cargarse
    desde el inicio.

    Esto evita esperar a que lleguemos
    a cada página.
*/

const fotosPrecargadas = [];


CONFIG.recuerdos.forEach(
    (recuerdo,index)=>{

        if(!recuerdo.foto){

            return;

        }


        const imagen =
            new Image();


        imagen.src =
            recuerdo.foto;


        fotosPrecargadas[index] =
            imagen;

    }
);


/* ================================================= */
/* DATOS INICIALES */
/* ================================================= */

$("titulo").textContent =
    CONFIG.titulo;


$("dedicatoria").textContent =
    CONFIG.dedicatoria;


$("secreto").textContent =
    CONFIG.sorpresa;


/* ================================================= */
/* MOSTRAR FOTO */
/* ================================================= */

function mostrarFoto(recuerdo){

    const foto =
        $("foto");


    const marco =
        $("marco");


    const ilustracion =
        $("ilustracion");


    /*
        Primero ocultamos el marco.
    */

    marco.classList.remove(
        "lista"
    );

    marco.classList.add(
        "cargando"
    );


    foto.onload = null;

    foto.onerror = null;


    foto.removeAttribute(
        "src"
    );


    foto.hidden = true;


    ilustracion.hidden = true;


    foto.alt =
        recuerdo.descripcion;


    if(!recuerdo.foto){

        ilustracion.hidden =
            false;


        marco.classList.remove(
            "cargando"
        );


        marco.classList.add(
            "lista"
        );


        return;

    }


    const indice =
        CONFIG.recuerdos.indexOf(
            recuerdo
        );


    const imagenPrecargada =
        fotosPrecargadas[indice];


    /*
        Función para mostrar la foto
        cuando ya esté disponible.
    */

    function imagenLista(){

        foto.hidden =
            false;


        ilustracion.hidden =
            true;


        /*
            Reiniciamos la animación.
        */

        foto.className = "";


        void foto.offsetWidth;


        /*
            Todas las fotos utilizan
            la misma aparición.

            Sin giro.
            Sin inclinación.
            Sin desplazamiento.
        */

        foto.classList.add(
            "foto-centro"
        );


        /*
            Ahora aparece el marco.
        */

        marco.classList.remove(
            "cargando"
        );


        marco.classList.add(
            "lista"
        );

    }


    function imagenError(){

        foto.hidden =
            true;


        ilustracion.hidden =
            false;


        marco.classList.remove(
            "cargando"
        );


        marco.classList.add(
            "lista"
        );

    }


    /*
        Si la imagen ya está cargada,
        aparece inmediatamente.
    */

    if(
        imagenPrecargada &&
        imagenPrecargada.complete &&
        imagenPrecargada.naturalWidth > 0
    ){

        foto.src =
            imagenPrecargada.src;


        imagenLista();


        return;

    }


    /*
        Si todavía está cargando,
        esperamos.
    */

    foto.onload =
        imagenLista;


    foto.onerror =
        imagenError;


    foto.src =
        recuerdo.foto;

}


/* ================================================= */
/* MOSTRAR PÁGINA */
/* ================================================= */

function mostrar(){

    $("avance").style.width =
        (pagina / total * 100) + "%";


    const portada =
        pagina === 0;


    $("portada").hidden =
        !portada;


    $("contenido").hidden =
        portada;


    $("contador").textContent =
        portada
        ?
        "Portada"
        :
        `Página ${pagina} de ${total}`;


    $("secreto").hidden =
        true;


    $("revelar").setAttribute(
        "aria-expanded",
        "false"
    );


    if(portada){

        $("marco").classList.remove(
            "lista"
        );

        $("marco").classList.add(
            "cargando"
        );

        return;

    }


    const final =
        pagina === total;


    $("marco").hidden =
        final;


    $("revelar").hidden =
        true;


    if(final){

        $("marco").classList.remove(
            "lista"
        );


        $("marco").classList.add(
            "cargando"
        );


        $("secreto").hidden =
            false;


        celebrar();


        $("fecha").textContent =
            "Y esto continúa…";


        $("encabezado").textContent =
            "Mi recuerdo favorito es contigo";


        $("texto").textContent =
            "Este libro es una pequeña manera de decirte cuánto significan para mí los momentos que compartimos.";

    }

    else{

        const r =
            CONFIG.recuerdos[
                pagina - 1
            ];


        $("fecha").textContent =
            r.fecha;


        $("encabezado").textContent =
            r.titulo;


        $("texto").textContent =
            r.texto;


        $("pie").textContent =
            r.pie;


        mostrarFoto(r);

    }


    $("numero").textContent =
        String(pagina)
        .padStart(2,"0");


    $("contenido").style.animation =
        "none";


    void $("contenido").offsetWidth;


    $("contenido").style.animation =
        "";

}


/* ================================================= */
/* RECORRIDO AUTOMÁTICO */
/* ================================================= */

let temporizador;

let pausado = false;

let historiaIniciada = false;


function programar(){

    clearTimeout(
        temporizador
    );


    if(!historiaIniciada){

        return;

    }


    const final =
        pagina === total;


    $("pausar").hidden =
        final;


    $("reiniciar").hidden =
        !final;


    if(final){

        desvanecerMusica(
            0,
            3500,
            true
        );

        return;

    }


    if(
        pausado ||
        document.hidden
    ){

        return;

    }


    const segundos =
        pagina === 0
        ?
        CONFIG.segundosPortada
        :
        CONFIG.segundosPorPagina;


    temporizador =
        setTimeout(()=>{

            pagina++;

            mostrar();

            programar();

        },Math.max(
            1,
            segundos
        ) * 1000);

}


/* ================================================= */
/* PAUSAR */
/* ================================================= */

$("pausar").onclick = ()=>{

    pausado =
        !pausado;


    $("pausar").textContent =
        pausado
        ?
        "Continuar recorrido"
        :
        "Pausar recorrido";


    if(pausado){

        desvanecerMusica(
            0,
            1800,
            true
        );

    }

    else{

        reproducirMusica()
            .then(()=>{

                desvanecerMusica(
                    0.35,
                    1800
                );

            });

    }


    programar();

};


/* ================================================= */
/* REINICIAR */
/* ================================================= */

$("reiniciar").onclick = ()=>{

    pagina =
        1;


    pausado =
        false;


    $("pausar").textContent =
        "Pausar recorrido";


    reproducirMusica()
        .then(()=>{

            desvanecerMusica(
                0.35,
                2200
            );

        });


    mostrar();

    programar();

};


/* ================================================= */
/* VISIBILIDAD */
/* ================================================= */

document.addEventListener(
    "visibilitychange",
    programar
);


/* ================================================= */
/* MÚSICA */
/* ================================================= */

const musica =
    $("musica");


musica.volume =
    0.35;


let intervaloVolumen;


function desvanecerMusica(
    volumenFinal,
    duracion = 1800,
    pausarAlFinal = false
){

    clearInterval(
        intervaloVolumen
    );


    const volumenInicial =
        musica.volume;


    const pasos =
        30;


    let paso =
        0;


    intervaloVolumen =
        setInterval(()=>{

            paso++;


            musica.volume =
                Math.max(
                    0,
                    Math.min(
                        1,

                        volumenInicial +

                        (
                            volumenFinal -
                            volumenInicial
                        )
                        *
                        (
                            paso /
                            pasos
                        )
                    )
                );


            if(
                paso >= pasos
            ){

                clearInterval(
                    intervaloVolumen
                );


                musica.volume =
                    volumenFinal;


                if(
                    pausarAlFinal &&
                    volumenFinal === 0
                ){

                    musica.pause();

                }

            }

        },duracion / pasos);

}


/* ================================================= */
/* REPRODUCIR MÚSICA */
/* ================================================= */

let audioIniciado =
    false;


async function reproducirMusica(){

    try{

        if(
            !musica.paused
        ){

            return;

        }


        if(
            musica.volume === 0
        ){

            musica.volume =
                0.01;

        }


        await musica.play();


        audioIniciado =
            true;


        $("estadoMusica").textContent =
            "";


        $("silenciar").hidden =
            false;


        document.removeEventListener(
            "click",
            primerGesto
        );


        document.removeEventListener(
            "touchend",
            primerGesto
        );


        document.removeEventListener(
            "keydown",
            primerGesto
        );

    }

    catch(error){

        if(
            error.name !==
            "NotAllowedError" &&

            error.name !==
            "AbortError"
        ){

            $("estadoMusica").textContent =
                "La canción no está disponible. El libro sigue abierto para ti.";

            console.warn(
                "Comprueba que exista cancion.mp3 y sea un MP3 válido.",
                error
            );

        }

    }

}


/* ================================================= */
/* PRIMER GESTO */
/* ================================================= */

function primerGesto(){

    reproducirMusica();

}


document.addEventListener(
    "click",
    primerGesto
);


document.addEventListener(
    "touchend",
    primerGesto,
    {
        passive:true
    }
);


document.addEventListener(
    "keydown",
    primerGesto
);


/* ================================================= */
/* SILENCIAR */
/* ================================================= */

$("silenciar").onclick = ()=>{

    musica.muted =
        !musica.muted;


    $("silenciar").textContent =
        musica.muted
        ?
        "Restaurar sonido"
        :
        "Silenciar sonido";


    $("silenciar").setAttribute(
        "aria-pressed",
        String(musica.muted)
    );

};


/* ================================================= */
/* INICIAR MÚSICA */
/* ================================================= */

reproducirMusica();


/* ================================================= */
/* ABRIR HISTORIA */
/* ================================================= */

$("abrir").onclick =
    async ()=>{

        musica.volume =
            0.01;


        await reproducirMusica();


        desvanecerMusica(
            0.35,
            2200
        );


        $("inicio")
            .classList
            .add("oculto");


        historiaIniciada =
            true;


        pagina =
            1;


        mostrar();


        programar();

    };


/* ================================================= */
/* PARTÍCULAS */
/* ================================================= */

const movimientoReducido =
    window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    );


if(
    !movimientoReducido.matches
){

    for(
        let i = 0;
        i < 12;
        i++
    ){

        const estrella =
            document.createElement(
                "span"
            );


        estrella.textContent =
            i % 2
            ?
            "♡"
            :
            "✧";


        estrella.style.left =
            (i * 8.5) + "%";


        estrella.style.animationDelay =
            (-i * 1.7) + "s";


        estrella.style.animationDuration =
            (14 + i % 4 * 3) + "s";


        $("particulas")
            .appendChild(
                estrella
            );

    }

}


/* ================================================= */
/* CELEBRACIÓN FINAL */
/* ================================================= */

function celebrar(){

    if(
        movimientoReducido.matches
    ){

        return;

    }


    for(
        let i = 0;
        i < 20;
        i++
    ){

        const c =
            document.createElement(
                "span"
            );


        c.className =
            "destello";


        c.textContent =
            i % 2
            ?
            "♥"
            :
            "✧";


        c.setAttribute(
            "aria-hidden",
            "true"
        );


        c.style.setProperty(
            "--dx",

            (
                Math.random() * 500 -
                250
            ) + "px"

        );


        c.style.setProperty(
            "--dy",

            (
                Math.random() * 400 -
                300
            ) + "px"

        );


        document.body.appendChild(c);


        setTimeout(
            ()=>c.remove(),
            1900
        );

    }

}


/* ================================================= */
/* MOSTRAR INICIALMENTE */
/* ================================================= */

mostrar();

</script>
