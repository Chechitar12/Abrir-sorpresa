<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los momentos que guardo contigo</title>

<style>

/* =========================================================
   ESTILOS GENERALES
========================================================= */

:root{
    --papel:#8f1028;
    --tinta:#fff;
    --rosa:#fff;
    --oro:#ffd4dc;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100svh;

    color:#fff;

    font-family:Georgia,serif;

    background:#650b1d;

    background-image:

        radial-gradient(
            circle at 15% 5%,
            #d94560 0,
            transparent 36%
        ),

        radial-gradient(
            circle at 90% 90%,
            #a91535 0,
            transparent 42%
        ),

        linear-gradient(
            145deg,
            #8f1028,
            #420815
        );
}


/* =========================================================
   PANTALLA INICIAL
========================================================= */

.inicio{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:

        radial-gradient(
            circle at 50% 15%,
            #df4864 0,
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #a71535,
            #4a0717
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.inicio.oculto{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.inicio-tarjeta{

    width:min(650px,100%);

    padding:55px 35px;

    text-align:center;

    background:#6c0b20d9;

    border:1px solid #fff;

    border-radius:20px;

    box-shadow:

        0 25px 80px #210008a8,

        inset 0 0 45px #ffffff12;
}

.inicio-corazon{

    display:block;

    font-size:65px;

    margin-bottom:20px;

    animation:
        latido 1.4s ease-in-out infinite;
}

@keyframes latido{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}


/* =========================================================
   TEXTOS
========================================================= */

header{

    text-align:center;

    font:
        11px Arial,
        sans-serif;

    letter-spacing:4px;

    margin:10px 0 25px;

    color:#fff;

    text-shadow:
        0 2px 8px #35000c;
}

.etiqueta{

    font:
        11px Arial,
        sans-serif;

    letter-spacing:3px;

    text-transform:uppercase;

    margin:20px 0;

    color:#ffe5ea;

    text-shadow:
        0 2px 6px #3d0613;
}

h1{

    font-size:
        clamp(38px,8vw,66px);

    font-weight:normal;

    line-height:1.08;

    max-width:550px;

    margin:15px auto;
}

h2{

    font-size:
        clamp(28px,5vw,40px);

    font-weight:normal;

    margin:15px 0;
}

p{

    line-height:1.7;

    white-space:pre-line;

    font-size:17px;

    max-width:560px;

    margin:16px auto;
}


/* =========================================================
   BOTÓN INICIAL
========================================================= */

button{

    border:0;

    border-radius:30px;

    padding:14px 22px;

    background:#fff;

    color:#8b1430;

    cursor:pointer;

    font:
        15px Arial,
        sans-serif;

    min-height:46px;

    transition:
        transform .2s ease,
        filter .2s ease;
}

button:hover{

    filter:brightness(1.08);

    transform:translateY(-2px);
}

button:focus-visible{

    outline:
        3px solid #d2a84e;

    outline-offset:4px;
}


/* =========================================================
   CONTENEDOR
========================================================= */

main{

    max-width:850px;

    margin:auto;

    padding:30px 18px;
}

.libro{

    position:relative;

    background:#99152f;

    border:1px solid #ffb9c7;

    border-radius:
        5px 16px 16px 5px;

    box-shadow:

        8px 8px 0 #740d23,

        12px 12px 0 #4d0717,

        0 30px 80px #21000888;

    overflow:hidden;
}

.libro:before{

    content:"";

    position:absolute;

    left:12px;

    top:0;

    bottom:0;

    width:1px;

    background:#ffcad466;

    z-index:1;
}


/* =========================================================
   PÁGINAS
========================================================= */

.pagina{

    position:relative;

    padding:
        34px 30px 28px;

    text-align:center;

    min-height:530px;

    color:#fff;

    background:

        radial-gradient(
            circle at 85% 10%,
            #d13a56 0,
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #a71634,
            #6f0c22
        );

    animation:
        entrada .45s ease;

    transform-origin:left center;
}

[hidden]{
    display:none!important;
}

@keyframes entrada{

    from{

        opacity:0;

        transform:
            perspective(900px)
            rotateY(-8deg);
    }

    to{

        opacity:1;

        transform:none;
    }
}


/* =========================================================
   PORTADA
========================================================= */

.portada{

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    min-height:580px;

    background:

        radial-gradient(
            circle at 20% 12%,
            #e04c67 0,
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #aa1838,
            #59091c
        );

    border:12px double #ffd2da;
}

.sello{

    font-size:45px;

    color:#ffd4dc;
}


/* =========================================================
   POLAROID
========================================================= */

.polaroid{

    position:relative;

    background:#fff;

    padding:
        12px 12px 28px;

    box-shadow:
        0 15px 38px #35000c99;

    max-width:560px;

    margin:22px auto;

    transform:rotate(-2deg);

    cursor:pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.polaroid:hover{

    transform:
        rotate(0deg)
        scale(1.01);

    box-shadow:
        0 18px 45px #35000cbb;
}

.polaroid img{

    display:block;

    width:100%;

    aspect-ratio:4/3;

    object-fit:cover;

    object-position:center;

    background:#eee;
}

.pie-foto{

    font-style:italic;

    font-size:14px;

    margin:12px 0 0;

    color:#6d1830;

    text-shadow:none;
}

.ilustracion{

    aspect-ratio:4/3;

    display:grid;

    place-content:center;

    background:
        linear-gradient(
            150deg,
            #d8d6c8,
            #f2dcc9
        );

    color:#71695f;

    font-size:72px;
}


/* =========================================================
   ANIMACIONES DE LAS FOTOS
========================================================= */

.foto-centro{

    animation:
        fotoCentro 1.6s
        cubic-bezier(.2,.7,.2,1)
        both;
}

.foto-lateral{

    animation:
        fotoLateral 1.6s
        cubic-bezier(.2,.7,.2,1)
        both;
}

.foto-cortina{

    animation:
        fotoCortina 1.8s
        ease-in-out
        both;
}

.foto-giro{

    animation:
        fotoGiro 1.8s
        cubic-bezier(.2,.7,.2,1)
        both;
}

.foto-album{

    transform-origin:left center;

    animation:
        fotoAlbum 1.8s
        ease-out
        both;

    backface-visibility:hidden;
}

@keyframes fotoCentro{

    from{
        opacity:0;
        transform:scale(.78);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fotoLateral{

    from{
        opacity:0;
        transform:translateX(55px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes fotoCortina{

    from{
        clip-path:inset(0 50%);
        opacity:.4;
    }

    to{
        clip-path:inset(0 0);
        opacity:1;
    }
}

@keyframes fotoGiro{

    from{
        opacity:0;
        transform:
            rotate(-8deg)
            scale(.88);
    }

    to{
        opacity:1;
        transform:
            rotate(0)
            scale(1);
    }
}

@keyframes fotoAlbum{

    from{
        opacity:0;
        transform:
            perspective(1000px)
            rotateY(-78deg);
    }

    to{
        opacity:1;
        transform:
            perspective(1000px)
            rotateY(0);
    }
}


/* =========================================================
   AVISO DE PAUSA
========================================================= */

.pausa-mensaje{

    position:fixed;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:500;

    padding:
        12px 22px;

    border-radius:30px;

    background:#550817e8;

    color:#fff;

    font:
        14px Arial,
        sans-serif;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease;
}

.pausa-mensaje.mostrar{

    opacity:1;
}


/* =========================================================
   CONTADOR Y PROGRESO
========================================================= */

#contador{

    font:
        12px Arial,
        sans-serif;

    color:#fff;

    text-align:center;

    text-shadow:
        0 2px 6px #35000c;
}

.progreso{

    width:100%;

    height:5px;

    margin-top:25px;

    background:#ffffff3d;

    border-radius:10px;

    overflow:hidden;
}

.progreso span{

    display:block;

    height:100%;

    width:0%;

    background:#fff;

    transition:
        width .4s ease;
}

.nota{

    text-align:center;

    color:#fff;

    font:
        12px Arial,
        sans-serif;

    margin:25px 0;

    text-shadow:
        0 2px 6px #35000c;
}


/* =========================================================
   ÚLTIMA PÁGINA
========================================================= */

.pagina.final{

    min-height:700px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding:
        25px 20px 35px;

    overflow:hidden;
}


/* =========================================================
   GIRASOLES
========================================================= */

.girasoles{

    position:relative;

    width:min(620px,100%);

    height:350px;

    margin:
        0 auto 0;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    gap:2px;
}


/* Cada girasol */

.girasol{

    position:relative;

    width:105px;

    height:315px;

    opacity:0;

    transform:
        translateY(100px)
        scale(.15);

    animation:
        aparecerGirasol 2s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* Formación uno por uno */

.girasol:nth-child(1){
    animation-delay:.1s;
}

.girasol:nth-child(2){
    animation-delay:.4s;
}

.girasol:nth-child(3){
    animation-delay:.7s;
}

.girasol:nth-child(4){
    animation-delay:1s;
}

.girasol:nth-child(5){
    animation-delay:1.3s;
}

.girasol:nth-child(6){
    animation-delay:1.6s;
}

.girasol:nth-child(7){
    animation-delay:1.9s;
}

@keyframes aparecerGirasol{

    0%{

        opacity:0;

        transform:
            translateY(100px)
            scale(.15)
            rotate(-20deg);
    }

    60%{

        opacity:1;

        transform:
            translateY(-10px)
            scale(1.08)
            rotate(5deg);
    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1)
            rotate(0);
    }
}


/* Tallo */

.tallo{

    position:absolute;

    bottom:0;

    left:50%;

    width:7px;

    height:190px;

    transform:
        translateX(-50%);

    border-radius:10px;

    background:
        linear-gradient(
            to right,
            #28551d,
            #57943b,
            #28551d
        );
}


/* Hojas */

.hoja{

    position:absolute;

    width:55px;

    height:26px;

    background:#4f8b35;

    border-radius:
        100% 0 100% 0;
}

.hoja.izquierda{

    left:calc(50% - 48px);

    bottom:75px;

    transform:
        rotate(25deg);
}

.hoja.derecha{

    right:calc(50% - 48px);

    bottom:115px;

    transform:
        rotate(155deg);
}


/* Cabeza */

.cabeza{

    position:absolute;

    left:50%;

    top:0;

    width:105px;

    height:105px;

    transform:
        translateX(-50%);

    border-radius:50%;
}


/* Pétalos */

.petalo{

    position:absolute;

    left:50%;

    top:50%;

    width:34px;

    height:58px;

    margin-left:-17px;

    margin-top:-29px;

    background:
        linear-gradient(
            to bottom,
            #ffe45b,
            #f2a900
        );

    border-radius:
        50% 50% 45% 45%;

    transform-origin:
        center 50px;

    box-shadow:
        0 2px 5px #5b320044;
}

.petalo:nth-child(1){
    transform:rotate(0deg);
}

.petalo:nth-child(2){
    transform:rotate(45deg);
}

.petalo:nth-child(3){
    transform:rotate(90deg);
}

.petalo:nth-child(4){
    transform:rotate(135deg);
}

.petalo:nth-child(5){
    transform:rotate(180deg);
}

.petalo:nth-child(6){
    transform:rotate(225deg);
}

.petalo:nth-child(7){
    transform:rotate(270deg);
}

.petalo:nth-child(8){
    transform:rotate(315deg);
}


/* Centro */

.centro{

    position:absolute;

    left:50%;

    top:50%;

    width:42px;

    height:42px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #5c3015 0,
            #7c4419 45%,
            #3e200d 100%
        );

    box-shadow:
        inset 0 0 0 4px #4c280f55;
}


/* =========================================================
   MENSAJE FINAL
========================================================= */

.mensaje-final{

    position:relative;

    z-index:10;

    width:min(600px,100%);

    margin:
        -10px auto 0;

    padding:
        0 15px;

    text-align:center;
}

.mensaje-final h2{

    margin:
        0 0 10px;

    font-size:
        clamp(28px,5vw,42px);

    color:#fff;

    text-shadow:
        0 3px 10px #3d0613;
}

.mensaje-final p{

    margin:
        8px auto;

    font-size:17px;

    line-height:1.7;

    color:#fff;

    text-shadow:
        0 2px 7px #3d0613;
}

.continuara{

    margin-top:16px!important;

    font-size:21px!important;

    font-style:italic;

    color:#ffd4dc!important;

    letter-spacing:2px;

    text-shadow:
        0 2px 8px #3d0613;
}


/* =========================================================
   PARTÍCULAS
========================================================= */

.particulas{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:5;

    overflow:hidden;
}

.particulas span{

    position:absolute;

    top:-30px;

    color:#ffffff38;

    animation:
        caer linear forwards;
}

@keyframes caer{

    to{

        transform:
            translateY(110vh)
            rotate(360deg);

        opacity:0;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    .pagina{

        padding:
            30px 20px;

        min-height:600px;
    }

    .pagina.final{

        min-height:680px;
    }

    .girasoles{

        height:310px;

        width:100%;
    }

    .girasol{

        width:80px;

        height:280px;
    }

    .cabeza{

        width:80px;

        height:80px;
    }

    .petalo{

        width:27px;

        height:48px;

        margin-left:-13.5px;

        margin-top:-24px;

        transform-origin:
            center 42px;
    }

    .centro{

        width:32px;

        height:32px;
    }

    .tallo{

        height:175px;
    }
}


@media(max-width:520px){

    main{

        padding:
            18px 14px;
    }

    .pagina{

        padding:
            26px 18px;

        min-height:530px;
    }

    .portada{

        min-height:550px;
    }

    .inicio-tarjeta{

        padding:
            45px 22px;
    }

    .girasoles{

        height:280px;
    }

    .girasol{

        width:62px;

        height:250px;
    }

    .girasol:nth-child(1),
    .girasol:nth-child(7){

        display:none;
    }

    .mensaje-final{

        padding:
            0 5px;
    }

}


/* =========================================================
   REDUCIR ANIMACIONES
========================================================= */

@media(prefers-reduced-motion:reduce){

    .pagina,
    .girasol,
    .inicio-corazon{

        animation:none;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     PANTALLA DE INICIO
======================================================= -->

<div
    class="inicio"
    id="inicio">

    <div class="inicio-tarjeta">

        <span
            class="inicio-corazon"
            aria-hidden="true">

            ♥

        </span>

        <div class="etiqueta">

            Una sorpresa hecha para ti

        </div>

        <h1>

            Los momentos que guardo contigo

        </h1>

        <button id="abrir">

            Abrir nuestra historia

        </button>

    </div>

</div>


<!-- =======================================================
     PARTÍCULAS
======================================================= -->

<div
    class="particulas"
    id="particulas"
    aria-hidden="true">
</div>


<!-- =======================================================
     MENSAJE DE PAUSA
======================================================= -->

<div
    class="pausa-mensaje"
    id="pausaMensaje">

    ⏸ Recorrido pausado

</div>


<!-- =======================================================
     MÚSICA
======================================================= -->

<audio
    id="musica"
    loop
    preload="auto">

    <source
        src="cancion.mp3"
        type="audio/mpeg">

</audio>


<!-- =======================================================
     CONTENIDO
======================================================= -->

<main>

    <p
        id="estadoMusica"
        role="status"
        style="
            font:13px Arial,sans-serif;
            text-align:center;
        ">
    </p>


    <header>

        HECHO DE PEQUEÑOS GRANDES MOMENTOS

    </header>


    <div
        class="libro"
        id="libro">


        <!-- =================================================
             PORTADA
        ================================================== -->

        <section
            class="pagina portada"
            id="portada">

            <div
                class="sello"
                aria-hidden="true">

                ✧

            </div>

            <div class="etiqueta">

                Una historia para guardar

            </div>

            <h1 id="titulo"></h1>

            <p id="dedicatoria"></p>

            <p class="etiqueta">

                Nuestra historia está por comenzar…

            </p>

        </section>


        <!-- =================================================
             PÁGINA DE CONTENIDO
        ================================================== -->

        <section
            class="pagina"
            id="contenido"
            hidden>


            <div
                class="etiqueta"
                id="fecha">
            </div>


            <h2
                id="encabezado">
            </h2>


            <!-- FOTO -->

            <figure
                class="polaroid"
                id="marco">


                <img
                    id="foto"
                    alt=""
                    hidden>


                <div
                    class="ilustracion"
                    id="ilustracion">

                    ✿

                </div>


                <figcaption
                    class="pie-foto"
                    id="pie">
                </figcaption>


            </figure>


            <p id="texto"></p>


            <div
                class="numero"
                id="numero">
            </div>


            <!-- =================================================
                 GIRASOLES
            ================================================== -->

            <div
                class="girasoles"
                id="girasoles"
                hidden>
            </div>


            <!-- =================================================
                 MENSAJE FINAL
            ================================================== -->

            <div
                class="mensaje-final"
                id="mensajeFinal"
                hidden>

                <h2>

                    Para ti ♥

                </h2>

                <p id="sorpresaFinal"></p>

                <p class="continuara">

                    Continuará…

                </p>

            </div>


        </section>

    </div>


    <!-- ===================================================
         PROGRESO
    ==================================================== -->

    <div
        class="progreso"
        aria-hidden="true">

        <span id="avance"></span>

    </div>


    <div
        style="
            text-align:center;
            margin-top:22px;
        ">

        <span
            id="contador"
            role="status"
            aria-live="polite">

            Portada

        </span>

    </div>


    <p class="nota">

        Toca la pantalla para pausar o continuar la historia.

    </p>


    <noscript>

        Activa JavaScript en tu navegador
        para abrir el libro.

    </noscript>

</main>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const CONFIG = {

    segundosPortada:4,

    segundosPorPagina:15,

    titulo:
        "Los momentos que guardo contigo",

    dedicatoria:
        "Hay recuerdos que merecen su propio libro. Este es el nuestro.",

    sorpresa:
        "Lo mejor de nuestra historia es que todavía nos quedan muchas páginas por escribir. Gracias por ser parte de mi vida. ♥",

    recuerdos:[

        {
            fecha:
                "El comienzo",

            titulo:
                "Donde empezó todo",

            foto:
                "foto1.png",

            descripcion:
                "Nuestra primera foto juntos",

            pie:
                "Un instante, muchas sonrisas.",

            texto:
                "Quizás ese día no imaginábamos cuántos recuerdos vendrían después. Hoy lo guardo como uno de mis favoritos."
        },


        {
            fecha:
                "Un día especial",

            titulo:
                "Nuestra pequeña aventura",

            foto:
                "foto2.png",

            descripcion:
                "Una aventura compartida",

            pie:
                "El mejor destino: compartirlo contigo.",

            texto:
                "No fue solo el lugar. Fueron las conversaciones, las risas y esa manera de convertir un día cualquiera en algo especial."
        },


        {
            fecha:
                "Siempre en mi memoria",

            titulo:
                "Las cosas más sencillas",

            foto:
                "foto3.png",

            descripcion:
                "Un momento que queremos recordar",

            pie:
                "De esos días que dan ganas de repetir.",

            texto:

/* =========================================================
   ELEMENTOS
========================================================= */

const inicio =
    document.getElementById("inicio");

const abrir =
    document.getElementById("abrir");

const musica =
    document.getElementById("musica");

const portada =
    document.getElementById("portada");

const contenido =
    document.getElementById("contenido");

const titulo =
    document.getElementById("titulo");

const dedicatoria =
    document.getElementById("dedicatoria");

const fecha =
    document.getElementById("fecha");

const encabezado =
    document.getElementById("encabezado");

const foto =
    document.getElementById("foto");

const marco =
    document.getElementById("marco");

const ilustracion =
    document.getElementById("ilustracion");

const pie =
    document.getElementById("pie");

const texto =
    document.getElementById("texto");

const numero =
    document.getElementById("numero");

const contador =
    document.getElementById("contador");

const avance =
    document.getElementById("avance");

const girasoles =
    document.getElementById("girasoles");

const mensajeFinal =
    document.getElementById("mensajeFinal");

const sorpresaFinal =
    document.getElementById("sorpresaFinal");

const pausaMensaje =
    document.getElementById("pausaMensaje");


/* =========================================================
   VARIABLES
========================================================= */

let paginaActual = -1;

let temporizador = null;

let pausado = false;

let historiaIniciada = false;


/* =========================================================
   PORTADA
========================================================= */

titulo.textContent =
    CONFIG.titulo;

dedicatoria.textContent =
    CONFIG.dedicatoria;


/* =========================================================
   PARTÍCULAS
========================================================= */

function crearParticulas(){

    const contenedor =
        document.getElementById("particulas");

    const simbolos = [
        "♥",
        "✦",
        "♡",
        "✧"
    ];

    for(
        let i=0;
        i<25;
        i++
    ){

        const span =
            document.createElement("span");

        span.textContent =
            simbolos[
                Math.floor(
                    Math.random() *
                    simbolos.length
                )
            ];

        span.style.left =
            Math.random()*100 + "%";

        span.style.fontSize =
            (10 + Math.random()*18) + "px";

        span.style.animationDuration =
            (7 + Math.random()*8) + "s";

        span.style.animationDelay =
            (Math.random()*8) + "s";

        contenedor.appendChild(span);
    }
}


/* =========================================================
   MÚSICA
========================================================= */

async function iniciarMusica(){

    try{

        musica.volume = 0.35;

        await musica.play();

    }catch(error){

        document.getElementById(
            "estadoMusica"
        ).textContent =
            "Pulsa nuevamente para iniciar la música.";

    }
}


/* =========================================================
   ABRIR HISTORIA
========================================================= */

abrir.addEventListener(
    "click",
    async function(event){

        event.stopPropagation();

        await iniciarMusica();

        historiaIniciada = true;

        inicio.classList.add("oculto");

        mostrar(-1);

    }
);


/* =========================================================
   MOSTRAR PÁGINA
========================================================= */

function mostrar(indice){

    clearTimeout(temporizador);

    paginaActual =
        indice;

    pausado = false;


    /* PORTADA */

    if(indice === -1){

        portada.hidden = false;

        contenido.hidden = true;

        contador.textContent =
            "Portada";

        avance.style.width =
            "0%";

        temporizador =
            setTimeout(
                ()=>{
                    mostrar(0);
                },
                CONFIG.segundosPortada * 1000
            );

        return;
    }


    /* ÚLTIMA PÁGINA */

    if(
        indice >=
        CONFIG.recuerdos.length
    ){

        mostrarFinal();

        return;
    }


    /* PÁGINA NORMAL */

    portada.hidden = true;

    contenido.hidden = false;

    contenido.classList.remove("final");

    girasoles.hidden = true;

    mensajeFinal.hidden = true;

    marco.hidden = false;

    foto.hidden = false;

    ilustracion.hidden = true;


    const recuerdo =
        CONFIG.recuerdos[indice];


    fecha.textContent =
        recuerdo.fecha;

    encabezado.textContent =
        recuerdo.titulo;

    texto.textContent =
        recuerdo.texto;

    pie.textContent =
        recuerdo.pie;

    numero.textContent =
        `Página ${indice + 1} de ${CONFIG.recuerdos.length}`;


    foto.alt =
        recuerdo.descripcion;

    foto.src =
        recuerdo.foto;


    /* Animación de cada fotografía */

    const animaciones = [

        "foto-centro",
        "foto-lateral",
        "foto-cortina",
        "foto-giro",
        "foto-album"

    ];

    animaciones.forEach(
        clase=>{
            foto.classList.remove(clase);
        }
    );

    void foto.offsetWidth;

    foto.classList.add(
        animaciones[
            indice %
            animaciones.length
        ]
    );


    contador.textContent =
        `Página ${indice + 1} de ${CONFIG.recuerdos.length}`;


    avance.style.width =
        (
            ((indice + 1) /
            CONFIG.recuerdos.length) *
            100
        ) + "%";


    /* 15 segundos */

    temporizador =
        setTimeout(
            ()=>{
                if(!pausado){
                    mostrar(
                        indice + 1
                    );
                }
            },
            CONFIG.segundosPorPagina * 1000
        );
}


/* =========================================================
   MOSTRAR FINAL
========================================================= */

function mostrarFinal(){

    clearTimeout(temporizador);

    paginaActual =
        CONFIG.recuerdos.length;

    portada.hidden = true;

    contenido.hidden = false;

    contenido.classList.add("final");

    marco.hidden = true;

    fecha.textContent =
        "Una última página";

    encabezado.textContent =
        "";

    texto.textContent =
        "";

    numero.textContent =
        "";

    contador.textContent =
        "Continuará…";

    avance.style.width =
        "100%";


    /* Formar girasoles */

    formarGirasoles();

    girasoles.hidden = false;

    mensajeFinal.hidden = false;

    sorpresaFinal.textContent =
        CONFIG.sorpresa;
}


/* =========================================================
   FORMAR GIRASOLES
========================================================= */

function formarGirasoles(){

    girasoles.innerHTML = "";


    for(
        let i=0;
        i<7;
        i++
    ){

        const girasol =
            document.createElement("div");

        girasol.className =
            "girasol";


        /* Tallo */

        const tallo =
            document.createElement("div");

        tallo.className =
            "tallo";


        /* Hoja izquierda */

        const hojaIzquierda =
            document.createElement("div");

        hojaIzquierda.className =
            "hoja izquierda";


        /* Hoja derecha */

        const hojaDerecha =
            document.createElement("div");

        hojaDerecha.className =
            "hoja derecha";


        /* Cabeza */

        const cabeza =
            document.createElement("div");

        cabeza.className =
            "cabeza";


        /* Pétalos */

        for(
            let j=0;
            j<8;
            j++
        ){

            const petalo =
                document.createElement("div");

            petalo.className =
                "petalo";

            cabeza.appendChild(
                petalo
            );
        }


        /* Centro */

        const centro =
            document.createElement("div");

        centro.className =
            "centro";

        cabeza.appendChild(
            centro
        );


        /* Construir flor */

        girasol.appendChild(
            tallo
        );

        girasol.appendChild(
            hojaIzquierda
        );

        girasol.appendChild(
            hojaDerecha
        );

        girasol.appendChild(
            cabeza
        );


        girasoles.appendChild(
            girasol
        );
    }
}


/* =========================================================
   PAUSAR / CONTINUAR
   RECORRIDO + MÚSICA
========================================================= */

function alternarPausa(){

    /*
       Si todavía no se abrió la historia,
       no hacemos nada.
    */

    if(!historiaIniciada){

        return;
    }


    /*
       En la última página ya no hay
       recorrido que pausar.
    */

    if(
        paginaActual >=
        CONFIG.recuerdos.length
    ){

        return;
    }


    /* =============================================
       PAUSAR
    ============================================= */

    if(!pausado){

        pausado = true;

        clearTimeout(
            temporizador
        );


        /* PAUSAR MÚSICA */

        musica.pause();


        mostrarAvisoPausa(
            "⏸ Recorrido pausado"
        );

    }


    /* =============================================
       CONTINUAR
    ============================================= */

    else{

        pausado = false;


        /* CONTINUAR MÚSICA */

        musica.play().catch(
            error=>{
                console.log(
                    "No se pudo continuar la música:",
                    error
                );
            }
        );


        /*
           Continuar con el recorrido.
        */

        temporizador =
            setTimeout(
                ()=>{
                    mostrar(
                        paginaActual + 1
                    );
                },
                CONFIG.segundosPorPagina * 1000
            );


        mostrarAvisoPausa(
            "▶ Continuando..."
        );
    }
}


/* =========================================================
   MENSAJE DE PAUSA
========================================================= */

function mostrarAvisoPausa(mensaje){

    pausaMensaje.textContent =
        mensaje;

    pausaMensaje.classList.add(
        "mostrar"
    );

    setTimeout(
        ()=>{
            pausaMensaje.classList.remove(
                "mostrar"
            );
        },
        900
    );
}


/* =========================================================
   TOCAR CUALQUIER PARTE DE LA PANTALLA
========================================================= */

document.addEventListener(
    "click",
    function(event){

        /*
           El botón de inicio ya tiene
           su propia función.
        */

        if(
            event.target === abrir
        ){

            return;
        }


        /*
           Si la historia todavía no
           comenzó, no hacemos nada.
        */

        if(!historiaIniciada){

            return;
        }


        alternarPausa();

    }
);


/* =========================================================
   PRE-CARGAR FOTOS
========================================================= */

CONFIG.recuerdos.forEach(
    recuerdo=>{

        const imagen =
            new Image();

        imagen.src =
            recuerdo.foto;

    }
);


/* =========================================================
   CREAR PARTÍCULAS
========================================================= */

crearParticulas();

</script>
