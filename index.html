<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los momentos que guardo contigo</title>

<style>

/* =========================================================
   ESTILOS GENERALES
========================================================= */

:root{
    --papel:#8f1028;
    --tinta:#fff;
    --rosa:#fff;
    --oro:#ffd4dc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#650b1d;
    color:#fff;
    font-family:Georgia,serif;
    min-height:100svh;

    background-image:
        radial-gradient(circle at 15% 5%,#d94560 0,transparent 36%),
        radial-gradient(circle at 90% 90%,#a91535 0,transparent 42%),
        linear-gradient(145deg,#8f1028,#420815);
}


/* =========================================================
   INICIO / PORTADA INICIAL
========================================================= */

.inicio{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(circle at 50% 15%,#df4864 0,transparent 38%),
        linear-gradient(145deg,#a71535,#4a0717);
}

.inicio-tarjeta{
    width:min(700px,100%);
    padding:50px 30px;
    text-align:center;

    background:#6c0b20d9;
    border:1px solid #fff;
    border-radius:18px;

    box-shadow:
        0 25px 80px #210008a8,
        inset 0 0 45px #ffffff12;
}

.inicio-corazon{
    display:block;
    font-size:65px;
    color:#fff;
    margin-bottom:15px;

    animation:latido 1.4s infinite;
}

.inicio h1{
    color:#fff;
    font-size:clamp(35px,7vw,60px);
    font-weight:normal;
    line-height:1.1;
    margin:15px auto 25px;
}

.inicio p{
    color:#fff;
}

.inicio .etiqueta{
    color:#fff;
}

.inicio button{
    background:#fff;
    color:#8b1430;
    border:0;
    border-radius:30px;
    padding:15px 25px;
    cursor:pointer;
    font:15px Arial,sans-serif;
}

.inicio button:hover{
    transform:scale(1.04);
}


/* =========================================================
   PARTICULAS
========================================================= */

.particulas{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2;
}

.particulas span{
    position:absolute;
    color:#ffffff38;
    font-size:20px;
    animation:flotar 8s linear infinite;
}


/* =========================================================
   CONTENEDOR
========================================================= */

main{
    max-width:850px;
    margin:auto;
    padding:30px 18px;
}

header{
    text-align:center;
    font:11px Arial,sans-serif;
    letter-spacing:4px;
    margin:10px 0 25px;
    color:#fff;
    text-shadow:0 2px 8px #35000c;
}


/* =========================================================
   LIBRO
========================================================= */

.libro{
    position:relative;

    background:#99152f;

    border-radius:5px 16px 16px 5px;
    border:1px solid #ffb9c7;

    box-shadow:
        8px 8px 0 #740d23,
        12px 12px 0 #4d0717,
        0 30px 80px #21000888;

    overflow:hidden;
}

.libro:before{
    content:"";
    position:absolute;
    left:12px;
    top:0;
    bottom:0;
    width:1px;
    background:#ffcad466;
    z-index:1;
}


/* =========================================================
   PAGINAS
========================================================= */

.pagina{
    padding:34px 30px 28px;
    text-align:center;
    min-height:530px;

    color:#fff;

    background:
        radial-gradient(circle at 85% 10%,#d13a56 0,transparent 35%),
        linear-gradient(145deg,#a71634,#6f0c22);

    animation:entrada .45s ease;
    transform-origin:left center;
}

[hidden]{
    display:none!important;
}

.pagina h2,
.pagina p,
.pagina .numero{
    color:#fff;
    text-shadow:0 2px 6px #3d0613;
}

.pagina .etiqueta{
    color:#ffe5ea;
    text-shadow:0 2px 6px #3d0613;
}


/* =========================================================
   PORTADA DEL LIBRO
========================================================= */

.portada{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(circle at 20% 12%,#e04c67 0,transparent 38%),
        linear-gradient(145deg,#aa1838,#59091c);

    color:#fff3df;
    min-height:580px;

    border:12px double #ffd2da;
}

.sello{
    font-size:45px;
    color:var(--oro);
}

.etiqueta{
    font:11px Arial,sans-serif;
    letter-spacing:3px;
    text-transform:uppercase;
    margin:20px 0;
}

h1{
    font-size:clamp(38px,8vw,66px);
    font-weight:normal;
    line-height:1.08;
    max-width:550px;
    margin:15px auto;
}

h2{
    font-size:clamp(28px,5vw,40px);
    font-weight:normal;
    margin:15px 0;
}

p{
    line-height:1.7;
    white-space:pre-line;
    font-size:17px;
    max-width:560px;
    margin:16px auto;
}


/* =========================================================
   BOTONES
========================================================= */

button{
    border:0;
    border-radius:30px;
    padding:14px 22px;

    background:#fff;
    color:#8b1430;

    cursor:pointer;
    font:15px Arial,sans-serif;

    min-height:46px;
}

button:hover{
    filter:brightness(1.1);
}

button:focus-visible{
    outline:3px solid #d2a84e;
    outline-offset:4px;
}

button:disabled{
    opacity:.4;
    cursor:default;
}

.portada button{
    background:#fff;
    color:#8b1430;
    margin-top:20px;
}


/* =========================================================
   MARCO DE LA FOTO
   TOTALMENTE RECTO Y CENTRADO
========================================================= */

figure.polaroid{

    /* CENTRADO */
    display:block !important;

    width:100% !important;
    max-width:560px !important;

    margin-top:22px !important;
    margin-bottom:22px !important;

    margin-left:auto !important;
    margin-right:auto !important;

    /* SIN INCLINACION */
    transform:rotate(0deg) !important;

    position:relative !important;

    left:auto !important;
    right:auto !important;

    /* MARCO BLANCO */
    background:#fff;

    padding:12px 12px 28px;

    box-shadow:0 15px 38px #35000c99;

    opacity:0;
    visibility:hidden;

    transition:opacity .25s ease;
}


/* Cuando la foto está lista */

figure.polaroid.lista{
    opacity:1;
    visibility:visible;
}


/* =========================================================
   FOTO DENTRO DEL MARCO
   TOTALMENTE CENTRADA Y DERECHA
========================================================= */

figure.polaroid img{

    display:block !important;

    width:100% !important;

    height:auto !important;

    margin:0 auto !important;

    padding:0 !important;

    /* MISMO ANCHO DEL MARCO */
    max-width:100% !important;

    aspect-ratio:4 / 3;

    object-fit:cover !important;

    object-position:center center !important;

    /* LA FOTO NO SE INCLINA */
    transform:none;

}


/* =========================================================
   ILUSTRACION MIENTRAS CARGA
========================================================= */

.ilustracion{
    aspect-ratio:4/3;

    display:grid;
    place-content:center;

    background:linear-gradient(150deg,#d8d6c8,#f2dcc9);

    color:#71695f;
    font-size:72px;
}


/* =========================================================
   TEXTO DEBAJO DE LA FOTO
========================================================= */

.pie-foto{
    font-style:italic;
    font-size:14px;
    margin:12px 0 0;

    color:#6d1830 !important;
    text-shadow:none !important;
}


/* =========================================================
   ANIMACIONES DE FOTOS
========================================================= */

.foto-centro,
.foto-lateral,
.foto-cortina,
.foto-giro,
.foto-album{

    display:block !important;

    width:100% !important;

    margin:0 auto !important;

    object-fit:cover !important;

    object-position:center center !important;

    animation:aparecerFoto 1s ease-out both;
}

@keyframes aparecerFoto{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================================================
   TEXTO Y CONTROLES
========================================================= */

nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:30px;
}

#contador{
    font:12px Arial,sans-serif;
    color:#fff;
    text-align:center;
    text-shadow:0 2px 6px #35000c;
}

.nota{
    text-align:center;
    color:#fff;
    font:12px Arial,sans-serif;
    margin:25px 0;
    text-shadow:0 2px 6px #35000c;
}

.secreto{
    padding:20px;

    border:1px dashed #ffd2da;
    border-radius:8px;

    margin-top:20px;

    background:#ffffff18;

    color:#fff !important;
}

.numero{
    font:11px Arial,sans-serif;
    color:#fff;
    letter-spacing:2px;
    margin-top:28px;
}

.sonido{
    color:#fff;
    border:1px solid #ffffff70;
    background:#ffffff10;
}


/* =========================================================
   BARRA DE PROGRESO
========================================================= */

.progreso{
    height:5px;
    background:#ffffff3d;

    border-radius:10px;

    margin-top:20px;

    overflow:hidden;
}

.progreso span{
    display:block;
    height:100%;
    width:0;

    background:#fff;

    transition:width .4s ease;
}


/* =========================================================
   ANIMACIONES GENERALES
========================================================= */

@keyframes entrada{

    from{
        opacity:0;
        transform:perspective(900px) rotateY(-8deg);
    }

    to{
        opacity:1;
        transform:none;
    }
}

@keyframes latido{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }
}

@keyframes flotar{

    0%{
        transform:translateY(100vh) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-10vh) rotate(360deg);
        opacity:0;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:520px){

    main{
        padding:18px 14px;
    }

    .pagina{
        padding:26px 18px;
        min-height:530px;
    }

    .portada{
        min-height:550px;
    }

    nav button{
        padding:12px 15px;
    }

    figure.polaroid{
        width:100% !important;
        max-width:100% !important;
        margin-left:auto !important;
        margin-right:auto !important;
    }

}


/* =========================================================
   RESPETAR REDUCCION DE MOVIMIENTO
========================================================= */

@media(prefers-reduced-motion:reduce){

    .pagina{
        animation:none;
    }

}


/* =========================================================
   ASEGURAR MARCO RECTO Y FOTO CENTRADA
========================================================= */

figure.polaroid{
    transform:rotate(0deg) !important;
    left:auto !important;
    right:auto !important;
    margin-left:auto !important;
    margin-right:auto !important;
}

figure.polaroid img{
    display:block !important;
    margin-left:auto !important;
    margin-right:auto !important;
    transform:none;
    object-position:center center !important;
}

</style>
</head>


<body>


<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<div class="inicio" id="inicio">

    <div class="inicio-tarjeta">

        <span class="inicio-corazon" aria-hidden="true">♥</span>

        <div class="etiqueta">
            Una sorpresa hecha para ti
        </div>

        <h1>
            Los momentos que guardo contigo
        </h1>

        <button id="abrir">
            Abrir nuestra historia
        </button>

    </div>

</div>


<!-- =====================================================
     PARTICULAS
===================================================== -->

<div class="particulas" id="particulas" aria-hidden="true"></div>


<!-- =====================================================
     MUSICA
===================================================== -->

<audio id="musica" loop autoplay preload="auto">

    <source src="cancion.mp3" type="audio/mpeg">

</audio>


<!-- =====================================================
     CONTENIDO PRINCIPAL
===================================================== -->

<main>

    <p
        id="estadoMusica"
        role="status"
        style="font:13px Arial,sans-serif;text-align:center">
    </p>


    <header>
        HECHO DE PEQUEÑOS GRANDES MOMENTOS
    </header>


    <!-- =================================================
         LIBRO
    ================================================== -->

    <div class="libro" id="libro">


        <!-- =================================================
             PORTADA
        ================================================== -->

        <section
            class="pagina portada"
            id="portada"
            aria-label="Portada">

            <div class="sello" aria-hidden="true">
                ✧
            </div>

            <div class="etiqueta">
                Una historia para guardar
            </div>

            <h1 id="titulo"></h1>

            <p id="dedicatoria"></p>

            <p class="etiqueta">
                Nuestra historia está por comenzar…
            </p>

        </section>


        <!-- =================================================
             PAGINAS DEL LIBRO
        ================================================== -->

        <section
            class="pagina"
            id="contenido"
            hidden
            aria-label="Página del libro">


            <div
                class="etiqueta"
                id="fecha">
            </div>


            <h2
                id="encabezado"
                tabindex="-1">
            </h2>


            <!-- MARCO DE FOTO -->

            <figure
                class="polaroid"
                id="marco">


                <img
                    id="foto"
                    alt=""
                    hidden>


                <div
                    class="ilustracion"
                    id="ilustracion"
                    aria-hidden="true">

                    ✿

                </div>


                <figcaption
                    class="pie-foto"
                    id="pie">
                </figcaption>


            </figure>


            <p id="texto"></p>


            <button
                id="revelar"
                hidden>

                Hay algo más para ti… 💌

            </button>


            <p
                id="secreto"
                class="secreto"
                hidden>
            </p>


            <div
                class="numero"
                id="numero">
            </div>


        </section>

    </div>


    <!-- =================================================
         PROGRESO
    ================================================== -->

    <div
        class="progreso"
        aria-hidden="true">

        <span id="avance"></span>

    </div>


    <!-- =================================================
         CONTROLES
    ================================================== -->

    <div
        style="text-align:center;margin-top:22px">

        <span
            id="contador"
            role="status"
            aria-live="polite">

            Portada

        </span>

        <br>

        <button
            class="sonido"
            id="pausar">

            Pausar recorrido

        </button>


        <button
            class="sonido"
            id="reiniciar"
            hidden>

            Volver a ver nuestra historia ↺

        </button>

    </div>


    <button
        class="sonido"
        id="silenciar"
        hidden
        aria-pressed="false">

        Silenciar sonido

    </button>


    <p class="nota">

        Las páginas avanzan solas. Disfruta nuestra historia.

    </p>


    <noscript>

        Activa JavaScript en tu navegador para abrir el libro.

    </noscript>

</main>


<script>


/* =========================================================
   CONFIGURACION
========================================================= */

const CONFIG = {

    segundosPortada:4,

    segundosPorPagina:9,

    titulo:"Los momentos que guardo contigo",

    dedicatoria:
        "Hay recuerdos que merecen su propio libro. Este es el nuestro.",

    sorpresa:
        "Lo mejor de nuestra historia es que todavía nos quedan muchas páginas por escribir. Gracias por ser parte de mi vida. ♥",

    recuerdos:[

        {
            fecha:"El comienzo",

            titulo:"Donde empezó todo",

            foto:"foto1.png",

            descripcion:"Nuestra primera foto juntos",

            pie:"Un instante, muchas sonrisas.",

            texto:
                "Quizás ese día no imaginábamos cuántos recuerdos vendrían después. Hoy lo guardo como uno de mis favoritos."
        },

        {
            fecha:"Un día especial",

            titulo:"Nuestra pequeña aventura",

            foto:"foto2.png",

            descripcion:"Una aventura compartida",

            pie:"El mejor destino: compartirlo contigo.",

            texto:
                "No fue solo el lugar. Fueron las conversaciones, las risas y esa manera de convertir un día cualquiera en algo especial."
        },

        {
            fecha:"Siempre en mi memoria",

            titulo:"Las cosas más sencillas",

            foto:"foto3.png",

            descripcion:"Un momento que queremos recordar",

            pie:"De esos días que dan ganas de repetir.",

            texto:
                "A veces la felicidad cabe en una foto, en una conversación larga o en una risa que no se puede contener."
        },

        {
            fecha:"Una aventura al atardecer",

            titulo:"Donde el cielo guardó este momento",

            foto:"foto4.png",

            descripcion:"Un paseo a caballo durante el atardecer",

            pie:"Un atardecer que siempre querré recordar.",

            texto:
                "El cielo cambió de colores y el tiempo pareció detenerse. Hay paisajes hermosos, pero los recuerdos son los que les dan un significado especial."
        },

        {
            fecha:"Un momento para nosotros",

            titulo:"Juntos, todo se siente especial",

            foto:"foto5.png",

            descripcion:"Un recuerdo de los dos juntos",

            pie:"Contigo, hasta lo cotidiano se vuelve inolvidable.",

            texto:
                "No importa el lugar ni el momento. Cuando estamos juntos, siempre aparece una razón para sonreír y guardar una nueva página en nuestra historia."
        }

    ]

};


/* =========================================================
   ELEMENTOS
========================================================= */

const inicio = document.getElementById("inicio");

const abrir = document.getElementById("abrir");

const musica = document.getElementById("musica");

const portada = document.getElementById("portada");

const contenido = document.getElementById("contenido");

const titulo = document.getElementById("titulo");

const dedicatoria = document.getElementById("dedicatoria");

const fecha = document.getElementById("fecha");

const encabezado = document.getElementById("encabezado");

const foto = document.getElementById("foto");

const ilustracion = document.getElementById("ilustracion");

const marco = document.getElementById("marco");

const pie = document.getElementById("pie");

const texto = document.getElementById("texto");

const revelar = document.getElementById("revelar");

const secreto = document.getElementById("secreto");

const numero = document.getElementById("numero");

const contador = document.getElementById("contador");

const pausar = document.getElementById("pausar");

const reiniciar = document.getElementById("reiniciar");

const silenciar = document.getElementById("silenciar");

const estadoMusica = document.getElementById("estadoMusica");

const avance = document.getElementById("avance");

const particulas = document.getElementById("particulas");


/* =========================================================
   VARIABLES
========================================================= */

let paginaActual = -1;

let temporizador = null;

let pausado = false;

let musicaIniciada = false;

let fotosPrecargadas = [];


/* =========================================================
   PRE-CARGAR FOTOS
========================================================= */

CONFIG.recuerdos.forEach((recuerdo,index)=>{

    if(!recuerdo.foto){
        return;
    }

    const imagen = new Image();

    imagen.src = recuerdo.foto;

    fotosPrecargadas[index] = imagen;

});


/* =========================================================
   TITULOS INICIALES
========================================================= */

titulo.textContent = CONFIG.titulo;

dedicatoria.textContent = CONFIG.dedicatoria;


/* =========================================================
   MOSTRAR FOTO
========================================================= */

function mostrarFoto(recuerdo,index){

    marco.classList.remove("lista");

    foto.hidden = true;

    ilustracion.hidden = false;

    foto.className = "";

    pie.textContent = "";

    const imagenPrecargada = fotosPrecargadas[index];


    function fotoLista(){

        foto.src = recuerdo.foto;

        foto.alt = recuerdo.descripcion;

        foto.hidden = false;

        ilustracion.hidden = true;

        pie.textContent = recuerdo.pie;

        marco.classList.add("lista");


        /* 
           Animacion de entrada de la FOTO.
           El MARCO permanece recto.
        */

        const animaciones = [
            "foto-centro",
            "foto-lateral",
            "foto-cortina",
            "foto-giro",
            "foto-album"
        ];

        foto.classList.add(
            animaciones[index % animaciones.length]
        );

    }


    if(
        imagenPrecargada &&
        imagenPrecargada.complete &&
        imagenPrecargada.naturalWidth > 0
    ){

        fotoLista();

    }else{

        foto.onload = fotoLista;

        foto.src = recuerdo.foto;

    }

}


/* =========================================================
   MOSTRAR PAGINA
========================================================= */

function mostrar(indice){

    clearTimeout(temporizador);

    paginaActual = indice;


    /* PORTADA */

    if(indice === -1){

        portada.hidden = false;

        contenido.hidden = true;

        contador.textContent = "Portada";

        avance.style.width = "0%";

        temporizador = setTimeout(()=>{

            if(!pausado){

                mostrar(0);

            }

        },CONFIG.segundosPortada * 1000);

        return;
    }


    /* PAGINAS DE RECUERDOS */

    if(indice < CONFIG.recuerdos.length){

        portada.hidden = true;

        contenido.hidden = false;


        const recuerdo = CONFIG.recuerdos[indice];


        fecha.textContent = recuerdo.fecha;

        encabezado.textContent = recuerdo.titulo;

        texto.textContent = recuerdo.texto;

        numero.textContent =
            "Página " +
            (indice + 1) +
            " de " +
            CONFIG.recuerdos.length;


        revelar.hidden = true;

        secreto.hidden = true;


        mostrarFoto(recuerdo,indice);


        contador.textContent =
            "Página " +
            (indice + 1) +
            " de " +
            CONFIG.recuerdos.length;


        const progreso =
            ((indice + 1) / CONFIG.recuerdos.length) * 100;

        avance.style.width =
            progreso + "%";


        temporizador = setTimeout(()=>{

            if(!pausado){

                mostrar(indice + 1);

            }

        },CONFIG.segundosPorPagina * 1000);


        return;
    }


    /* PAGINA FINAL */

    portada.hidden = true;

    contenido.hidden = false;

    marco.classList.remove("lista");

    foto.hidden = true;

    ilustracion.hidden = false;

    ilustracion.textContent = "♥";

    fecha.textContent = "Una última página";

    encabezado.textContent = "Para ti";

    texto.textContent = CONFIG.sorpresa;

    pie.textContent = "";

    numero.textContent = "Fin de nuestra historia";

    revelar.hidden = true;

    secreto.hidden = true;

    contador.textContent = "Nuestra historia";

    avance.style.width = "100%";

    reiniciar.hidden = false;

    pausar.hidden = true;

    crearConfeti();

}


/* =========================================================
   BOTON ABRIR
========================================================= */

abrir.addEventListener("click",()=>{

    inicio.style.display = "none";

    iniciarMusica();

    pausado = false;

    mostrar(-1);

});


/* =========================================================
   MUSICA
========================================================= */

musica.volume = 0.35;


function iniciarMusica(){

    if(musicaIniciada){
        return;
    }

    musica.play()
        .then(()=>{

            musicaIniciada = true;

            estadoMusica.textContent =
                "♪ Música activada";

            silenciar.hidden = false;

        })
        .catch(()=>{

            estadoMusica.textContent =
                "Pulsa nuevamente para activar la música.";

        });

}


/* =========================================================
   SILENCIAR
========================================================= */

silenciar.addEventListener("click",()=>{

    if(musica.muted){

        musica.muted = false;

        silenciar.textContent =
            "Silenciar sonido";

        silenciar.setAttribute(
            "aria-pressed",
            "false"
        );

    }else{

        musica.muted = true;

        silenciar.textContent =
            "Activar sonido";

        silenciar.setAttribute(
            "aria-pressed",
            "true"
        );

    }

});


/* =========================================================
   PAUSAR / CONTINUAR
========================================================= */

pausar.addEventListener("click",()=>{

    pausado = !pausado;


    if(pausado){

        clearTimeout(temporizador);

        pausar.textContent =
            "Continuar recorrido";

    }else{

        pausar.textContent =
            "Pausar recorrido";

        mostrar(paginaActual);

    }

});


/* =========================================================
   REINICIAR
========================================================= */

reiniciar.addEventListener("click",()=>{

    reiniciar.hidden = true;

    pausar.hidden = false;

    pausado = false;

    mostrar(-1);

});


/* =========================================================
   PARTICULAS
========================================================= */

function crearParticulas(){

    for(let i=0;i<18;i++){

        const span =
            document.createElement("span");

        span.textContent =
            Math.random() > .5
            ? "♥"
            : "✦";

        span.style.left =
            Math.random() * 100 + "%";

        span.style.animationDelay =
            Math.random() * 8 + "s";

        span.style.animationDuration =
            5 + Math.random() * 8 + "s";

        particulas.appendChild(span);

    }

}

crearParticulas();


/* =========================================================
   CONFETI FINAL
========================================================= */

function crearConfeti(){

    for(let i=0;i<35;i++){

        const span =
            document.createElement("span");

        span.textContent =
            Math.random() > .5
            ? "♥"
            : "✦";

        span.style.left =
            Math.random() * 100 + "%";

        span.style.top =
            Math.random() * 100 + "%";

        span.style.animation =
            "latido 1s infinite";

        span.style.animationDelay =
            Math.random() + "s";

        particulas.appendChild(span);

    }

}


/* =========================================================
   VISIBILIDAD DE LA PESTAÑA
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(document.hidden){

            clearTimeout(temporizador);

        }else if(!pausado){

            mostrar(paginaActual);

        }

    }
);

</script>
