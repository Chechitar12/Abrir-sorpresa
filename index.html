<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Los momentos que guardo contigo</title>

    <style>

        /* =====================================================
           ESTILOS GENERALES
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;

            background-color: #650b1d;

            background-image:
                radial-gradient(
                    circle at 15% 5%,
                    #d94560 0,
                    transparent 36%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #a91535 0,
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #8f1028,
                    #420815
                );
        }


        /* =====================================================
           LIBRO
        ===================================================== */

        .libro {
            width: min(1100px, 94%);
            min-height: 700px;
            margin: 30px auto;

            background: #99152f;

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 0 50px rgba(255, 255, 255, 0.05);

            position: relative;
            overflow: hidden;
        }


        /* =====================================================
           PAGINAS
        ===================================================== */

        .pagina {
            min-height: 700px;
            padding: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 255, 255, 0.05),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #99152f,
                    #650b1d
                );
        }


        /* =====================================================
           PORTADA
        ===================================================== */

        .portada {
            min-height: 700px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    #c72a49,
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #99152f,
                    #420815
                );
        }


        .portada-contenido {
            max-width: 700px;
        }


        .portada-corazon {
            font-size: 80px;
            color: #ffffff;

            animation:
                latido 1.5s ease-in-out infinite;
        }


        .portada h1 {
            margin-top: 20px;

            font-size: clamp(35px, 6vw, 65px);
            line-height: 1.1;

            color: #ffffff;

            text-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }


        .portada p {
            margin-top: 25px;

            font-size: 22px;
            line-height: 1.6;

            color: #ffffff;
        }


        /* =====================================================
           INICIO / SORPRESA
        ===================================================== */

        .inicio {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 15% 5%,
                    #d94560 0,
                    transparent 36%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #a91535 0,
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #8f1028,
                    #420815
                );

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }


        .inicio.oculto {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        .inicio-tarjeta {
            width: min(600px, 90%);

            padding: 55px 40px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #8d1027,
                    #560a19
                );

            border-radius: 25px;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            animation:
                aparecer 1.2s ease both;
        }


        .inicio-corazon {
            display: block;

            font-size: 75px;
            color: #ffffff;

            animation:
                latido 1.5s ease-in-out infinite;
        }


        .inicio .etiqueta {
            margin-top: 15px;

            color: #ffffff;

            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }


        .inicio h1 {
            margin-top: 20px;

            color: #ffffff;

            font-size: clamp(32px, 5vw, 55px);
            line-height: 1.15;
        }


        .inicio button {
            margin-top: 35px;

            padding: 15px 30px;

            border: none;
            border-radius: 50px;

            background: #ffffff;
            color: #650b1d;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .inicio button:hover {
            transform: translateY(-4px) scale(1.03);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.3);
        }


        /* =====================================================
           PAGINA DE RECUERDO
        ===================================================== */

        .recuerdo {
            width: 100%;

            display: grid;

            grid-template-columns:
                minmax(280px, 1fr)
                minmax(280px, 1fr);

            gap: 50px;

            align-items: center;
        }


        .recuerdo-texto {
            text-align: left;
        }


        .recuerdo-fecha {
            display: inline-block;

            padding: 8px 15px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.12);

            color: #ffffff;

            font-size: 14px;
            letter-spacing: 1px;
        }


        .recuerdo h2 {
            margin-top: 20px;

            font-size: clamp(30px, 4vw, 48px);

            line-height: 1.15;

            color: #ffffff;
        }


        .recuerdo-descripcion {
            margin-top: 18px;

            font-size: 20px;
            line-height: 1.6;

            color: #ffffff;
        }


        .recuerdo-pie {
            margin-top: 25px;

            font-style: italic;

            font-size: 17px;

            color: #ffffff;
        }


        .recuerdo-texto-principal {
            margin-top: 20px;

            font-size: 18px;
            line-height: 1.8;

            color: #ffffff;
        }


        /* =====================================================
           CONTENEDOR DE FOTO
        ===================================================== */

        .foto-contenedor {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 420px;

            perspective: 1200px;
        }


        .polaroid {
            width: min(430px, 100%);

            padding: 15px 15px 30px;

            background: #ffffff;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.35);

            transform-origin: center center;

            overflow: hidden;
        }


        .polaroid img {
            display: block;

            width: 100%;
            height: 360px;

            object-fit: cover;

            background: #eeeeee;
        }


        .polaroid figcaption {
            margin-top: 15px;

            color: #650b1d;

            text-align: center;

            font-size: 17px;
            font-weight: bold;
        }


        /* =====================================================
           ILUSTRACION SI NO CARGA LA FOTO
        ===================================================== */

        .ilustracion {
            width: 100%;
            height: 360px;

            display: none;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #650b1d,
                    #99152f
                );

            color: #ffffff;

            font-size: 80px;
        }


        /* =====================================================
           ANIMACIONES DE LAS FOTOS
        ===================================================== */

        .foto-centro {
            animation:
                fotoCentro 1.6s cubic-bezier(.2, .7, .2, 1) both;
        }


        .foto-lateral {
            animation:
                fotoLateral 1.6s cubic-bezier(.2, .7, .2, 1) both;
        }


        .foto-cortina {
            animation:
                fotoCortina 1.8s ease-in-out both;
        }


        .foto-giro {
            animation:
                fotoGiro 1.8s cubic-bezier(.2, .7, .2, 1) both;
        }


        .foto-album {
            transform-origin: left center;

            animation:
                fotoAlbum 1.8s ease-out both;

            backface-visibility: hidden;
        }


        /* =====================================================
           KEYFRAMES
        ===================================================== */

        @keyframes fotoCentro {

            from {
                opacity: 0;
                transform: scale(0.78);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        @keyframes fotoLateral {

            from {
                opacity: 0;
                transform: translateX(55px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        @keyframes fotoCortina {

            from {
                opacity: 0;
                clip-path: inset(0 50% 0 50%);
            }

            to {
                opacity: 1;
                clip-path: inset(0 0 0 0);
            }
        }


        @keyframes fotoGiro {

            from {
                opacity: 0;
                transform:
                    rotate(-8deg)
                    scale(0.88);
            }

            to {
                opacity: 1;
                transform:
                    rotate(0)
                    scale(1);
            }
        }


        @keyframes fotoAlbum {

            from {
                opacity: 0;
                transform:
                    perspective(800px)
                    rotateY(-78deg);
            }

            to {
                opacity: 1;
                transform:
                    perspective(800px)
                    rotateY(0);
            }
        }


        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        @keyframes latido {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }


        /* =====================================================
           CONTADOR
        ===================================================== */

        #contador {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 100;

            padding: 10px 18px;

            background: rgba(255, 255, 255, 0.95);

            color: #650b1d;

            border-radius: 30px;

            font-size: 14px;
            font-weight: bold;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.2);
        }


        /* =====================================================
           NOTA FINAL
        ===================================================== */

        .nota {
            max-width: 750px;

            padding: 50px;

            text-align: center;

            background: rgba(255, 255, 255, 0.96);

            color: #650b1d;

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
        }


        .nota-corazon {
            font-size: 65px;

            margin-bottom: 20px;
        }


        .nota h2 {
            font-size: clamp(32px, 5vw, 55px);

            margin-bottom: 25px;
        }


        .nota p {
            font-size: 20px;
            line-height: 1.8;
        }


        /* =====================================================
           CONTROL DE SONIDO
        ===================================================== */

        .sonido {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 100;

            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #ffffff;

            color: #650b1d;

            border: none;

            cursor: pointer;

            font-size: 20px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           PARTICULAS
        ===================================================== */

        .particula {
            position: fixed;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #ffffff;

            opacity: 0.6;

            pointer-events: none;

            animation:
                flotar linear infinite;
        }


        @keyframes flotar {

            from {
                transform:
                    translateY(100vh)
                    scale(0.5);

                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            80% {
                opacity: 0.6;
            }

            to {
                transform:
                    translateY(-10vh)
                    scale(1);

                opacity: 0;
            }
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .libro {
                width: 96%;
                margin: 15px auto;
            }

            .pagina,
            .portada {
                padding: 30px 20px;
            }

            .recuerdo {
                grid-template-columns: 1fr;

                gap: 30px;
            }

            .recuerdo-texto {
                text-align: center;
            }

            .foto-contenedor {
                min-height: auto;
            }

            .polaroid {
                width: 100%;
            }

            .polaroid img,
            .ilustracion {
                height: 300px;
            }

            .nota {
                padding: 35px 25px;
            }
        }


        @media (max-width: 500px) {

            .inicio-tarjeta {
                padding: 40px 25px;
            }

            .inicio-corazon {
                font-size: 60px;
            }

            .pagina {
                min-height: 650px;
            }

            .recuerdo h2 {
                font-size: 32px;
            }

            .recuerdo-descripcion {
                font-size: 17px;
            }

            .recuerdo-texto-principal {
                font-size: 16px;
            }

            .polaroid img,
            .ilustracion {
                height: 260px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         MUSICA
    ====================================================== -->

    <audio id="musica" loop preload="auto">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>


    <!-- =====================================================
         PARTICULAS
    ====================================================== -->

    <div class="particula" style="left:10%; animation-duration:12s;"></div>
    <div class="particula" style="left:25%; animation-duration:15s;"></div>
    <div class="particula" style="left:40%; animation-duration:11s;"></div>
    <div class="particula" style="left:55%; animation-duration:17s;"></div>
    <div class="particula" style="left:70%; animation-duration:13s;"></div>
    <div class="particula" style="left:85%; animation-duration:16s;"></div>


    <!-- =====================================================
         CONTADOR
    ====================================================== -->

    <div id="contador">
        Preparando nuestra historia...
    </div>


    <!-- =====================================================
         PORTADA / INICIO
    ====================================================== -->

    <div class="inicio" id="inicio">

        <div class="inicio-tarjeta">

            <span class="inicio-corazon" aria-hidden="true">
                ♥
            </span>

            <div class="etiqueta">
                Una sorpresa hecha para ti
            </div>

            <h1>
                Los momentos que guardo contigo
            </h1>

            <button id="abrir">
                Abrir nuestra historia
            </button>

        </div>

    </div>


    <!-- =====================================================
         LIBRO
    ====================================================== -->

    <main class="libro" id="libro">

        <!-- AQUÍ SE CARGAN LAS PÁGINAS MEDIANTE JAVASCRIPT -->

    </main>


    <!-- =====================================================
         BOTON DE SONIDO
    ====================================================== -->

    <button
        class="sonido"
        id="btnSonido"
        title="Activar o desactivar música"
        aria-label="Activar o desactivar música">

        🔊

    </button>


    <script>

        /* =====================================================
           CONFIGURACIÓN
        ===================================================== */

        const CONFIG = {

            segundosPortada: 4,

            segundosPorPagina: 9,

            titulo:
                "Los momentos que guardo contigo",

            dedicatoria:
                "Hay recuerdos que merecen su propio libro. Este es el nuestro.",

            sorpresa:
                "Lo mejor de nuestra historia es que todavía nos quedan muchas páginas por escribir. Gracias por ser parte de mi vida. ♥",

            recuerdos: [

                {
                    fecha: "El comienzo",

                    titulo:
                        "Donde empezó todo",

                    foto:
                        "foto1.png",

                    descripcion:
                        "Nuestra primera foto juntos",

                    pie:
                        "Un instante, muchas sonrisas.",

                    texto:
                        "Quizás ese día no imaginábamos cuántos recuerdos vendrían después. Hoy lo guardo como uno de mis favoritos."
                },

                {
                    fecha: "Un día especial",

                    titulo:
                        "Nuestra pequeña aventura",

                    foto:
                        "foto2.png",

                    descripcion:
                        "Una aventura compartida",

                    pie:
                        "El mejor destino: compartirlo contigo.",

                    texto:
                        "No fue solo el lugar. Fueron las conversaciones, las risas y esa manera de convertir un día cualquiera en algo especial."
                },

                {
                    fecha: "Siempre en mi memoria",

                    titulo:
                        "Las cosas más sencillas",

                    foto:
                        "foto3.png",

                    descripcion:
                        "Un momento que queremos recordar",

                    pie:
                        "De esos días que dan ganas de repetir.",

                    texto:
                        "A veces la felicidad cabe en una foto, en una conversación larga o en una risa que no se puede contener."
                },

                {
                    fecha:
                        "Una aventura al atardecer",

                    titulo:
                        "Donde el cielo guardó este momento",

                    foto:
                        "foto4.png",

                    descripcion:
                        "Un paseo a caballo durante el atardecer",

                    pie:
                        "Un atardecer que siempre querré recordar.",

                    texto:
                        "El cielo cambió de colores y el tiempo pareció detenerse. Hay paisajes hermosos, pero los recuerdos son los que les dan un significado especial."
                },

                {
                    fecha:
                        "Un momento para nosotros",

                    titulo:
                        "Juntos, todo se siente especial",

                    foto:
                        "foto5.png",

                    descripcion:
                        "Un recuerdo de los dos juntos",

                    pie:
                        "Contigo, hasta lo cotidiano se vuelve inolvidable.",

                    texto:
                        "No importa el lugar ni el momento. Cuando estamos juntos, siempre aparece una razón para sonreír y guardar una nueva página en nuestra historia."
                }

            ]
        };


        /* =====================================================
           VARIABLES
        ===================================================== */

        const libro =
            document.getElementById("libro");

        const inicio =
            document.getElementById("inicio");

        const abrir =
            document.getElementById("abrir");

        const musica =
            document.getElementById("musica");

        const contador =
            document.getElementById("contador");

        const btnSonido =
            document.getElementById("btnSonido");


        let paginaActual = 0;

        let temporizador = null;

        let musicaActiva = true;


        /* =====================================================
           CREAR PORTADA
        ===================================================== */

        function crearPortada() {

            libro.innerHTML = `

                <section class="pagina portada">

                    <div class="portada-contenido">

                        <div class="portada-corazon">
                            ♥
                        </div>

                        <h1>
                            ${CONFIG.titulo}
                        </h1>

                        <p>
                            ${CONFIG.dedicatoria}
                        </p>

                    </div>

                </section>

            `;
        }


        /* =====================================================
           MOSTRAR FOTO
        ===================================================== */

        function mostrarFoto(recuerdo, indice) {

            const animaciones = [

                "foto-centro",

                "foto-lateral",

                "foto-cortina",

                "foto-giro",

                "foto-album"

            ];

            const animacion =
                animaciones[indice] ||
                "foto-centro";


            libro.innerHTML = `

                <section class="pagina">

                    <div class="recuerdo">

                        <div class="recuerdo-texto">

                            <span class="recuerdo-fecha">
                                ${recuerdo.fecha}
                            </span>

                            <h2>
                                ${recuerdo.titulo}
                            </h2>

                            <p class="recuerdo-descripcion">
                                ${recuerdo.descripcion}
                            </p>

                            <p class="recuerdo-pie">
                                ${recuerdo.pie}
                            </p>

                            <p class="recuerdo-texto-principal">
                                ${recuerdo.texto}
                            </p>

                        </div>


                        <div class="foto-contenedor">

                            <figure class="polaroid ${animacion}">

                                <img
                                    src="${recuerdo.foto}"
                                    alt="${recuerdo.descripcion}"
                                >

                                <figcaption>
                                    ${recuerdo.pie}
                                </figcaption>

                            </figure>

                        </div>

                    </div>

                </section>

            `;


            const imagen =
                libro.querySelector(".polaroid img");


            imagen.addEventListener(
                "error",
                function () {

                    this.style.display = "none";

                    const ilustracion =
                        document.createElement("div");

                    ilustracion.className =
                        "ilustracion";

                    ilustracion.style.display =
                        "flex";

                    ilustracion.innerHTML = "♥";

                    this.parentElement.insertBefore(
                        ilustracion,
                        this.nextElementSibling
                    );

                }
            );

        }


        /* =====================================================
           PAGINA FINAL
        ===================================================== */

        function mostrarFinal() {

            libro.innerHTML = `

                <section class="pagina">

                    <div class="nota">

                        <div class="nota-corazon">
                            ♥
                        </div>

                        <h2>
                            Para ti
                        </h2>

                        <p>
                            ${CONFIG.sorpresa}
                        </p>

                    </div>

                </section>

            `;
        }


        /* =====================================================
           MOSTRAR PAGINA
        ===================================================== */

        function mostrar() {

            clearTimeout(temporizador);


            const total =
                CONFIG.recuerdos.length + 2;


            contador.textContent =
                `Página ${paginaActual + 1} de ${total}`;


            if (paginaActual === 0) {

                crearPortada();

            }

            else if (
                paginaActual >= 1 &&
                paginaActual <= CONFIG.recuerdos.length
            ) {

                mostrarFoto(
                    CONFIG.recuerdos[paginaActual - 1],
                    paginaActual - 1
                );

            }

            else {

                mostrarFinal();

            }


            temporizador = setTimeout(

                () => {

                    paginaActual++;

                    if (
                        paginaActual >
                        CONFIG.recuerdos.length + 1
                    ) {

                        paginaActual = 0;

                    }

                    mostrar();

                },

                paginaActual === 0
                    ? CONFIG.segundosPortada * 1000
                    : CONFIG.segundosPorPagina * 1000

            );

        }


        /* =====================================================
           REPRODUCIR MUSICA
        ===================================================== */

        function reproducirMusica() {

            if (!musicaActiva) {
                return;
            }


            musica.volume = 0.35;


            const promesa =
                musica.play();


            if (promesa !== undefined) {

                promesa.catch(
                    function () {
                        console.log(
                            "El navegador bloqueó el autoplay."
                        );
                    }
                );

            }

        }


        /* =====================================================
           BOTON ABRIR
        ===================================================== */

        abrir.addEventListener(
            "click",
            function () {

                reproducirMusica();


                inicio.classList.add(
                    "oculto"
                );


                paginaActual = 1;


                mostrar();

            }
        );


        /* =====================================================
           BOTON DE SONIDO
        ===================================================== */

        btnSonido.addEventListener(
            "click",
            function () {

                if (musica.paused) {

                    musicaActiva = true;

                    musica.play();

                    btnSonido.textContent = "🔊";

                }

                else {

                    musicaActiva = false;

                    musica.pause();

                    btnSonido.textContent = "🔇";

                }

            }
        );


        /* =====================================================
           INICIO
        ===================================================== */

        crearPortada();


    </script>

</body>

</html>
