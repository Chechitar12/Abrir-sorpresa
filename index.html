<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Los momentos que guardo contigo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #efe6dc;
            color: #4b3b32;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .portada {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(255,255,255,.55), transparent 35%),
                linear-gradient(135deg, #e9d8c8, #f5eee8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .portada.oculta {
            opacity: 0;
            visibility: hidden;
        }

        .portada-contenido {
            text-align: center;
            width: 90%;
            max-width: 650px;
            padding: 40px;
        }

        .portada-contenido .decoracion {
            font-size: 35px;
            margin-bottom: 20px;
            color: #9c7661;
        }

        .portada-contenido h1 {
            font-size: clamp(38px, 7vw, 72px);
            font-weight: normal;
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .portada-contenido p {
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 35px;
            color: #69554a;
        }

        .btn-abrir {
            border: none;
            background: #806454;
            color: white;
            padding: 16px 34px;
            border-radius: 40px;
            font-family: inherit;
            font-size: 17px;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 10px 25px rgba(80, 55, 40, .2);
        }

        .btn-abrir:hover {
            transform: translateY(-3px);
            background: #6d5244;
        }

        .libro {
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hoja {
            width: 100%;
            max-width: 1000px;
            min-height: 680px;
            background: #fffdf9;
            border-radius: 8px;
            padding: 50px;
            box-shadow:
                0 25px 60px rgba(60, 40, 25, .18),
                0 2px 8px rgba(60, 40, 25, .1);
            position: relative;
            overflow: hidden;
        }

        .hoja::before {
            content: "";
            position: absolute;
            top: 0;
            left: 35px;
            bottom: 0;
            width: 1px;
            background: rgba(150, 120, 100, .12);
        }

        .pagina {
            display: none;
            animation: aparecer .8s ease;
        }

        .pagina.activa {
            display: block;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .encabezado {
            text-align: center;
            margin-bottom: 35px;
        }

        .fecha {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 13px;
            color: #9c7661;
            margin-bottom: 12px;
        }

        .encabezado h2 {
            font-size: clamp(28px, 5vw, 46px);
            font-weight: normal;
            margin-bottom: 15px;
        }

        .linea {
            width: 70px;
            height: 2px;
            background: #b9957f;
            margin: auto;
        }

        .foto-contenedor {
            width: 100%;
            max-width: 700px;
            margin: 0 auto 25px;
            text-align: center;
        }

        .foto {
            display: block;
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            border-radius: 5px;
            box-shadow: 0 12px 30px rgba(60, 40, 25, .18);
            background: #eee5dc;
        }

        .foto.oculta {
            display: none;
        }

        .ilustracion {
            display: none;
            padding: 60px 20px;
            text-align: center;
            font-size: 65px;
            background: #f3ebe3;
            border-radius: 5px;
        }

        .ilustracion.mostrar {
            display: block;
        }

        .pie-foto {
            margin-top: 12px;
            font-size: 14px;
            font-style: italic;
            color: #8c7669;
        }

        .descripcion {
            max-width: 760px;
            margin: 0 auto;
            text-align: center;
        }

        .descripcion h3 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .descripcion p {
            font-size: 17px;
            line-height: 1.9;
            color: #5e5048;
        }

        .final {
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .final-contenido {
            max-width: 700px;
        }

        .final-contenido .corazon {
            font-size: 60px;
            margin-bottom: 25px;
        }

        .final-contenido h2 {
            font-size: clamp(35px, 6vw, 58px);
            font-weight: normal;
            margin-bottom: 25px;
        }

        .final-contenido p {
            font-size: 19px;
            line-height: 2;
            color: #66544a;
        }

        .controles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 35px;
        }

        .btn-control {
            border: 1px solid #b9957f;
            background: transparent;
            color: #705849;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            transition: .3s;
        }

        .btn-control:hover {
            background: #806454;
            color: white;
        }

        .contador {
            font-size: 14px;
            color: #8b766a;
            min-width: 70px;
            text-align: center;
        }

        .indicador-musica {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #806454;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        .indicador-musica.pausada {
            opacity: .55;
        }

        @media (max-width: 700px) {

            .libro {
                padding: 15px;
            }

            .hoja {
                padding: 30px 25px;
                min-height: 600px;
            }

            .hoja::before {
                left: 15px;
            }

            .portada-contenido {
                padding: 25px;
            }

            .portada-contenido p {
                font-size: 17px;
            }

            .foto {
                max-height: 350px;
            }

            .descripcion p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- PORTADA -->

    <section class="portada" id="portada">

        <div class="portada-contenido">

            <div class="decoracion">♥</div>

            <h1>Los momentos que guardo contigo</h1>

            <p>
                Hay recuerdos que merecen su propio libro.
                Este es el nuestro.
            </p>

            <button class="btn-abrir" id="abrir">
                Abrir nuestra historia
            </button>

        </div>

    </section>


    <!-- LIBRO -->

    <main class="libro">

        <div class="hoja" id="hoja">

            <section class="pagina activa" id="pagina">

                <div class="encabezado">

                    <div class="fecha" id="fecha"></div>

                    <h2 id="titulo"></h2>

                    <div class="linea"></div>

                </div>


                <div class="foto-contenedor">

                    <img
                        id="foto"
                        class="foto"
                        src=""
                        alt=""
                    >

                    <div class="ilustracion" id="ilustracion">
                        ♥
                    </div>

                    <div class="pie-foto" id="pie"></div>

                </div>


                <div class="descripcion">

                    <h3 id="descripcion"></h3>

                    <p id="texto"></p>

                </div>


                <div class="controles">

                    <button class="btn-control" id="anterior">
                        ← Anterior
                    </button>

                    <div class="contador" id="contador">
                        1 / 5
                    </div>

                    <button class="btn-control" id="siguiente">
                        Siguiente →
                    </button>

                </div>

            </section>


            <!-- PAGINA FINAL -->

            <section class="pagina final" id="paginaFinal">

                <div class="final-contenido">

                    <div class="corazon">
                        ♥
                    </div>

                    <h2>Una última página...</h2>

                    <p id="sorpresa"></p>

                </div>

            </section>

        </div>

    </main>


    <!-- MUSICA -->

    <audio
        id="musica"
        loop
        preload="auto">

        <source
            src="cancion.mp3"
            type="audio/mpeg">

    </audio>


    <!-- BOTON DE MUSICA -->

    <div
        class="indicador-musica pausada"
        id="indicadorMusica"
        title="Reproducir / pausar música">

        ♪

    </div>


    <script>

        /* =========================================
           CONFIGURACION
        ========================================== */

        const CONFIG = {

            segundosPortada: 4,

            segundosPorPagina: 9,

            titulo: "Los momentos que guardo contigo",

            dedicatoria:
                "Hay recuerdos que merecen su propio libro. Este es el nuestro.",

            sorpresa:
                "Lo mejor de nuestra historia es que todavía nos quedan muchas páginas por escribir. Gracias por ser parte de mi vida. ♥",

            recuerdos: [

                {
                    fecha: "El comienzo",

                    titulo: "Donde empezó todo",

                    foto: "foto1.png",

                    descripcion: "Nuestra primera foto juntos",

                    pie: "Un instante, muchas sonrisas.",

                    texto:
                        "Quizás ese día no imaginábamos cuántos recuerdos vendrían después. Hoy lo guardo como uno de mis favoritos."
                },

                {
                    fecha: "Un día especial",

                    titulo: "Nuestra pequeña aventura",

                    foto: "foto2.png",

                    descripcion: "Una aventura compartida",

                    pie:
                        "El mejor destino: compartirlo contigo.",

                    texto:
                        "No fue solo el lugar. Fueron las conversaciones, las risas y esa manera de convertir un día cualquiera en algo especial."
                },

                {
                    fecha: "Siempre en mi memoria",

                    titulo: "Las cosas más sencillas",

                    foto: "foto3.png",

                    descripcion:
                        "Un momento que queremos recordar",

                    pie:
                        "De esos días que dan ganas de repetir.",

                    texto:
                        "A veces la felicidad cabe en una foto, en una conversación larga o en una risa que no se puede contener."
                },

                {
                    fecha: "Una aventura al atardecer",

                    titulo:
                        "Donde el cielo guardó este momento",

                    foto: "foto4.png",

                    descripcion:
                        "Un paseo a caballo durante el atardecer",

                    pie:
                        "Un atardecer que siempre querré recordar.",

                    texto:
                        "El cielo cambió de colores y el tiempo pareció detenerse. Hay paisajes hermosos, pero los recuerdos son los que les dan un significado especial."
                },

                {
                    fecha: "Un momento para nosotros",

                    titulo:
                        "Juntos, todo se siente especial",

                    foto: "foto5.png",

                    descripcion:
                        "Un recuerdo de los dos juntos",

                    pie:
                        "Contigo, hasta lo cotidiano se vuelve inolvidable.",

                    texto:
                        "No importa el lugar ni el momento. Cuando estamos juntos, siempre aparece una razón para sonreír y guardar una nueva página en nuestra historia."
                }

            ]

        };


        /* =========================================
           ELEMENTOS
        ========================================== */

        const portada =
            document.getElementById("portada");

        const abrir =
            document.getElementById("abrir");

        const foto =
            document.getElementById("foto");

        const ilustracion =
            document.getElementById("ilustracion");

        const fecha =
            document.getElementById("fecha");

        const titulo =
            document.getElementById("titulo");

        const descripcion =
            document.getElementById("descripcion");

        const pie =
            document.getElementById("pie");

        const texto =
            document.getElementById("texto");

        const contador =
            document.getElementById("contador");

        const anterior =
            document.getElementById("anterior");

        const siguiente =
            document.getElementById("siguiente");

        const paginaFinal =
            document.getElementById("paginaFinal");

        const pagina =
            document.getElementById("pagina");

        const sorpresa =
            document.getElementById("sorpresa");

        const musica =
            document.getElementById("musica");

        const indicadorMusica =
            document.getElementById("indicadorMusica");


        /* =========================================
           VARIABLES
        ========================================== */

        let paginaActual = 0;

        let intervalo = null;


        /* =========================================
           MOSTRAR FOTO
        ========================================== */

        function mostrarFoto(recuerdo) {

            foto.classList.remove("oculta");

            ilustracion.classList.remove("mostrar");

            /*
             * La ruta ahora corresponde exactamente
             * al lugar donde están las imágenes
             * dentro del repositorio.
             */

            foto.src = recuerdo.foto;

            foto.alt = recuerdo.descripcion;


            foto.onload = function () {

                foto.classList.remove("oculta");

                ilustracion.classList.remove("mostrar");

            };


            foto.onerror = function () {

                console.error(
                    "ERROR: No se pudo cargar la imagen:",
                    recuerdo.foto
                );

                foto.classList.add("oculta");

                ilustracion.classList.add("mostrar");

            };

        }


        /* =========================================
           MOSTRAR PAGINA
        ========================================== */

        function mostrar() {

            if (
                paginaActual >=
                CONFIG.recuerdos.length
            ) {

                mostrarPaginaFinal();

                return;
            }


            const recuerdo =
                CONFIG.recuerdos[paginaActual];


            pagina.classList.add("activa");

            paginaFinal.classList.remove("activa");


            fecha.textContent =
                recuerdo.fecha;

            titulo.textContent =
                recuerdo.titulo;

            descripcion.textContent =
                recuerdo.descripcion;

            pie.textContent =
                recuerdo.pie;

            texto.textContent =
                recuerdo.texto;


            contador.textContent =
                `${paginaActual + 1} / ${CONFIG.recuerdos.length}`;


            mostrarFoto(recuerdo);


            anterior.disabled =
                paginaActual === 0;


            siguiente.textContent =
                paginaActual ===
                CONFIG.recuerdos.length - 1
                    ? "Final →"
                    : "Siguiente →";

        }


        /* =========================================
           PAGINA FINAL
        ========================================== */

        function mostrarPaginaFinal() {

            pagina.classList.remove("activa");

            paginaFinal.classList.add("activa");

            sorpresa.textContent =
                CONFIG.sorpresa;

            detenerAutomatico();

        }


        /* =========================================
           SIGUIENTE
        ========================================== */

        function siguientePagina() {

            if (
                paginaActual <
                CONFIG.recuerdos.length
            ) {

                paginaActual++;

                mostrar();

            }

        }


        /* =========================================
           ANTERIOR
        ========================================== */

        function anteriorPagina() {

            if (paginaActual > 0) {

                paginaActual--;

                mostrar();

            }

        }


        /* =========================================
           AUTOMATICO
        ========================================== */

        function iniciarAutomatico() {

            detenerAutomatico();


            intervalo = setInterval(
                function () {

                    siguientePagina();

                },
                CONFIG.segundosPorPagina * 1000
            );

        }


        function detenerAutomatico() {

            if (intervalo) {

                clearInterval(intervalo);

                intervalo = null;

            }

        }


        /* =========================================
           MUSICA
        ========================================== */

        async function reproducirMusica() {

            try {

                musica.volume = 0.8;

                await musica.play();

                indicadorMusica.classList.remove(
                    "pausada"
                );

                console.log(
                    "Música reproduciéndose correctamente."
                );

            }

            catch (error) {

                console.error(
                    "No se pudo reproducir la música:",
                    error
                );

                indicadorMusica.classList.add(
                    "pausada"
                );

            }

        }


        function pausarMusica() {

            musica.pause();

            indicadorMusica.classList.add(
                "pausada"
            );

        }


        /* =========================================
           BOTON ABRIR
        ========================================== */

        abrir.onclick = async function () {

            /*
             * Primero reproducimos la música
             * aprovechando el clic del usuario.
             */

            await reproducirMusica();


            /*
             * Luego ocultamos la portada.
             */

            portada.classList.add("oculta");


            /*
             * Mostramos la primera página.
             */

            paginaActual = 0;

            mostrar();


            /*
             * Iniciamos el cambio automático.
             */

            iniciarAutomatico();

        };


        /* =========================================
           BOTON SIGUIENTE
        ========================================== */

        siguiente.onclick =
            function () {

                siguientePagina();

            };


        /* =========================================
           BOTON ANTERIOR
        ========================================== */

        anterior.onclick =
            function () {

                anteriorPagina();

            };


        /* =========================================
           BOTON MUSICA
        ========================================== */

        indicadorMusica.onclick =
            async function () {

                if (musica.paused) {

                    await reproducirMusica();

                }

                else {

                    pausarMusica();

                }

            };


        /* =========================================
           EVENTOS DEL AUDIO
        ========================================== */

        musica.addEventListener(
            "play",
            function () {

                indicadorMusica.classList.remove(
                    "pausada"
                );

            }
        );


        musica.addEventListener(
            "pause",
            function () {

                indicadorMusica.classList.add(
                    "pausada"
                );

            }
        );


        musica.addEventListener(
            "error",
            function () {

                console.error(
                    "ERROR: No se pudo cargar cancion.mp3"
                );

            }
        );


        /* =========================================
           MOSTRAR PRIMERA PAGINA
        ========================================== */

        mostrar();

    </script>

</body>
</html>
