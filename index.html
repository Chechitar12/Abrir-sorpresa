<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los momentos que guardo contigo</title>

<style>

/* ============================= */
/* ESTILOS ORIGINALES */
/* ============================= */

:root{
    --papel:#fff9ed;
    --tinta:#42352e;
    --rosa:#995b63;
    --oro:#cba974;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#e8dfd4;
    color:var(--tinta);
    font-family:Georgia,serif;
    min-height:100svh;

    background-image:
        radial-gradient(
            ellipse at top,
            #fffaf1,
            transparent 70%
        );
}

main{
    max-width:850px;
    margin:auto;
    padding:30px 18px;
}

header{
    text-align:center;
    font:11px Arial,sans-serif;
    letter-spacing:4px;
    margin:10px 0 25px;
    color:#73665d;
}

.libro{
    position:relative;
    background:var(--papel);
    border-radius:5px 16px 16px 5px;
    border:1px solid #d8c7ac;

    box-shadow:
        8px 8px 0 #dfd1bb,
        12px 12px 0 #cdbda7,
        0 25px 60px #42352e22;

    overflow:hidden;
}

.libro:before{
    content:"";
    position:absolute;
    left:12px;
    top:0;
    bottom:0;
    width:1px;
    background:#c8b59955;
    z-index:1;
}

.pagina{
    padding:34px 30px 28px;
    text-align:center;
    min-height:530px;
    animation:entrada .45s ease;
    transform-origin:left center;
}

[hidden]{
    display:none!important;
}

.portada{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:#6d3e49;
    color:#fff3df;

    min-height:580px;
    border:12px double #c9a37b;
}

.sello{
    font-size:45px;
    color:var(--oro);
}

.etiqueta{
    font:11px Arial,sans-serif;
    letter-spacing:3px;
    text-transform:uppercase;
    margin:20px 0;
}

h1{
    font-size:clamp(38px,8vw,66px);
    font-weight:normal;
    line-height:1.08;
    max-width:550px;
    margin:15px auto;
}

h2{
    font-size:clamp(28px,5vw,40px);
    font-weight:normal;
    margin:15px 0;
}

p{
    line-height:1.7;
    white-space:pre-line;
    font-size:17px;
    max-width:560px;
    margin:16px auto;
}

button{
    border:0;
    border-radius:30px;
    padding:14px 22px;
    background:var(--rosa);
    color:white;
    cursor:pointer;
    font:15px Arial,sans-serif;
    min-height:46px;
}

button:hover{
    filter:brightness(1.1);
}

button:focus-visible{
    outline:3px solid #d2a84e;
    outline-offset:4px;
}

button:disabled{
    opacity:.4;
    cursor:default;
}

.portada button{
    background:#f9ead2;
    color:#633c44;
    margin-top:20px;
}

.polaroid{
    background:white;
    padding:12px 12px 28px;

    box-shadow:
        0 5px 18px #42352e20;

    max-width:560px;
    margin:22px auto;

    transform:rotate(-2deg);

    /* NUEVO */
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease;
}

.polaroid.lista{
    opacity:1;
    visibility:visible;
}

.polaroid img{
    display:block;
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    object-position:center;
    background:#eee;
}

.ilustracion{
    aspect-ratio:4/3;
    display:grid;
    place-content:center;
    background:linear-gradient(150deg,#d8d6c8,#f2dcc9);
    color:#71695f;
    font-size:72px;
}

.pie-foto{
    font-style:italic;
    font-size:14px;
    margin:12px 0 0;
}

nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:30px;
}

#contador{
    font:12px Arial,sans-serif;
    color:#75675b;
    text-align:center;
}

.nota{
    text-align:center;
    color:#887b71;
    font:12px Arial,sans-serif;
    margin:25px 0;
}

.secreto{
    padding:20px;
    border:1px dashed var(--oro);
    border-radius:8px;
    margin-top:20px;
    background:#f4e9d9;
}

.numero{
    font:11px Arial,sans-serif;
    color:#a79279;
    letter-spacing:2px;
    margin-top:28px;
}

@keyframes entrada{

    from{
        opacity:0;
        transform:
            perspective(900px)
            rotateY(-8deg);
    }

    to{
        opacity:1;
        transform:none;
    }

}

@media(max-width:520px){

    main{
        padding:18px 14px;
    }

    .pagina{
        padding:26px 18px;
        min-height:530px;
    }

    .portada{
        min-height:550px;
    }

    nav button{
        padding:12px 15px;
    }

}

@media(prefers-reduced-motion:reduce){

    .pagina{
        animation:none;
    }

}


/* ============================= */
/* NUEVO DISEÑO */
/* ============================= */

body{

    background:
        radial-gradient(
            circle at 20% 10%,
            #fff0f4 0,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 90%,
            #f5dce3 0,
            transparent 40%
        ),
        #e8dfd4;
}


/* INTRO */

.inicio{

    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:9999;

    background:
        radial-gradient(
            circle at 50% 15%,
            #f7dce4 0,
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #f8e8ed,
            #e6d0d7
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.inicio.oculto{

    opacity:0;
    visibility:hidden;
    pointer-events:none;

}

.inicio-tarjeta{

    width:min(90%,650px);

    padding:55px 30px;

    text-align:center;

    border:1px solid #cba974;

    border-radius:20px;

    background:#fff9edee;

    box-shadow:
        0 25px 80px #42352e55,
        inset 0 0 45px #ffffffaa;

}

.inicio-corazon{

    font-size:65px;
    color:#995b63;

    display:block;

    animation:
        latido 1.5s infinite;
}

.inicio h1{

    color:#42352e;

}

.inicio p{

    color:#73665d;

}

.inicio button{

    margin-top:20px;

}


/* PROGRESO */

.progreso{

    height:5px;

    margin-top:22px;

    border-radius:10px;

    overflow:hidden;

    background:#cba97455;

}

.progreso span{

    display:block;

    height:100%;

    width:0;

    background:#995b63;

    transition:width .5s ease;

}


/* SONIDO */

.sonido{

    color:#42352e;
    border:1px solid #cba974;
    background:#ffffff55;

    margin:5px;
}


/* PARTICULAS */

.particulas{

    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:2;
}

.particulas span{

    position:absolute;

    top:100%;

    color:#995b6345;

    font-size:25px;

    animation:
        flotar 16s linear infinite;

}


/* DESTELLOS */

.destello{

    position:fixed;

    left:50%;
    top:50%;

    font-size:25px;

    pointer-events:none;

    z-index:10000;

    animation:
        confeti 1.9s ease-out forwards;
}


/* ANIMACIONES DE FOTOS */

.foto-centro{

    animation:
        fotoCentro 1.6s cubic-bezier(.2,.7,.2,1) both;
}

.foto-lateral{

    animation:
        fotoLateral 1.6s cubic-bezier(.2,.7,.2,1) both;
}

.foto-cortina{

    animation:
        fotoCortina 1.8s ease-in-out both;
}

.foto-giro{

    animation:
        fotoGiro 1.8s cubic-bezier(.2,.7,.2,1) both;
}

.foto-album{

    transform-origin:left center;

    animation:
        fotoAlbum 1.8s ease-out both;

    backface-visibility:hidden;
}


@keyframes fotoCentro{

    from{
        opacity:0;
        transform:scale(.78);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

@keyframes fotoLateral{

    from{
        opacity:0;
        transform:translateX(55px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}

@keyframes fotoCortina{

    from{
        clip-path:inset(0 50%);
        opacity:.4;
    }

    to{
        clip-path:inset(0 0);
        opacity:1;
    }

}

@keyframes fotoGiro{

    from{
        opacity:0;
        transform:
            rotate(-8deg)
            scale(.88);
    }

    to{
        opacity:1;
        transform:
            rotate(0)
            scale(1);
    }

}

@keyframes fotoAlbum{

    from{
        opacity:0;
        transform:
            perspective(1000px)
            rotateY(-78deg);
    }

    to{
        opacity:1;
        transform:
            perspective(1000px)
            rotateY(0);
    }

}

@keyframes latido{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}

@keyframes flotar{

    from{
        transform:
            translateY(0)
            rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    to{
        transform:
            translateY(-120vh)
            rotate(360deg);
        opacity:0;
    }

}

@keyframes confeti{

    from{
        opacity:1;
        transform:
            translate(0,0)
            scale(1);
    }

    to{
        opacity:0;
        transform:
            translate(var(--dx),var(--dy))
            scale(.3)
            rotate(360deg);
    }

}


/* ============================= */
/* TEMA ROJO ROMÁNTICO */
/* ============================= */

:root{

body{

}

}

.pagina h2,

}

        ),

}

}

.inicio button{

.polaroid{

.polaroid .pie-foto{

}

}

}

}

.progreso span{

}

}


/* ============================= */
/* MEJORA DE CARGA DE FOTOS */
/* ============================= */

.polaroid.cargando{

    opacity:0;
    visibility:hidden;

}

    opacity:1;
    visibility:visible;

}

</style>
</head>


<body>


<!-- ============================= -->
<!-- INTRODUCCIÓN -->
<!-- ============================= -->

<div class="inicio" id="inicio">

    <div class="inicio-tarjeta">

        <span
            class="inicio-corazon"
            aria-hidden="true">

        </span>

        <div class="etiqueta">
            Una sorpresa hecha para ti
        </div>

        <h1>
            Los momentos que guardo contigo
        </h1>

        <button id="abrir">

        </button>

    </div>

</div>


<!-- ============================= -->
<!-- PARTICULAS -->
<!-- ============================= -->

<div
    class="particulas"
    id="particulas"
    aria-hidden="true">
</div>


<!-- ============================= -->
<!-- MÚSICA -->
<!-- ============================= -->

<audio
    id="musica"
    loop
    autoplay
    preload="auto">

    <source
        src="cancion.mp3"
        type="audio/mpeg">

</audio>


<main>

    <p
        id="estadoMusica"
        role="status"
        style="font:13px Arial,sans-serif;text-align:center">

    <header>

    </header>


    <!-- ============================= -->
    <!-- LIBRO -->
    <!-- ============================= -->

    <div
        class="libro"
        id="libro">


        <!-- PORTADA -->

        <section
            class="pagina portada"
            id="portada"
            aria-label="Portada">

            <div
                class="sello"
                aria-hidden="true">

            </div>

            <div class="etiqueta">

            </div>

        <section
            class="pagina"

                class="etiqueta"

            <h2
                id="encabezado"
                tabindex="-1">

            <figure
                class="polaroid cargando"
                id="marco">

                    id="foto"
                    alt=""
                    hidden>

<script>

/* ================================================= */
/* CONFIGURACIÓN */
/* ================================================= */

const CONFIG = {

    segundosPortada:4,

    segundosPorPagina:9,

    titulo:
        "Los momentos que guardo contigo",

    dedicatoria:
        "Hay recuerdos que merecen su propio libro. Este es el nuestro.",

    sorpresa:
        "Lo mejor de nuestra historia es que todavía nos quedan muchas páginas por escribir. Gracias por ser parte de mi vida. ♥",

    recuerdos:[

        {

            fecha:"El comienzo",

            titulo:"Donde empezó todo",

            foto:"foto1.png",

            descripcion:
                "Nuestra primera foto juntos",

            pie:
                "Un instante, muchas sonrisas.",

            texto:
                "Quizás ese día no imaginábamos cuántos recuerdos vendrían después. Hoy lo guardo como uno de mis favoritos."

        },


        {

            fecha:"Un día especial",

            titulo:"Nuestra pequeña aventura",

            foto:"foto2.png",

            descripcion:
                "Una aventura compartida",

            pie:
                "El mejor destino: compartirlo contigo.",

            texto:
                "No fue solo el lugar. Fueron las conversaciones, las risas y esa manera de convertir un día cualquiera en algo especial."

        },


        {

            fecha:"Siempre en mi memoria",

            titulo:"Las cosas más sencillas",

            foto:"foto3.png",

            descripcion:
                "Un momento que queremos recordar",

            pie:
                "De esos días que dan ganas de repetir.",

            texto:
                "A veces la felicidad cabe en una foto, en una conversación larga o en una risa que no se puede contener."

        },


        {

            fecha:"Una aventura al atardecer",

            titulo:"Donde el cielo guardó este momento",

            foto:"foto4.png",

            descripcion:
                "Un paseo a caballo durante el atardecer",

            pie:
                "Un atardecer que siempre querré recordar.",

            texto:
                "El cielo cambió de colores y el tiempo pareció detenerse. Hay paisajes hermosos, pero los recuerdos son los que les dan un significado especial."

        },


        {

            fecha:"Un momento para nosotros",

            titulo:"Juntos, todo se siente especial",

            foto:"foto5.png",

            descripcion:
                "Un recuerdo de los dos juntos",

            pie:
                "Contigo, hasta lo cotidiano se vuelve inolvidable.",

            texto:
                "No importa el lugar ni el momento. Cuando estamos juntos, siempre aparece una razón para sonreír y guardar una nueva página en nuestra historia."

        }

    ]

};


/* ================================================= */
/* ELEMENTOS */
/* ================================================= */

const $ = id =>
    document.getElementById(id);


let pagina = 0;

const total =
    CONFIG.recuerdos.length + 1;


/* ================================================= */
/* PRECARGAR TODAS LAS FOTOS */
/* ================================================= */

/*
   ESTA ES LA MEJORA PRINCIPAL.

   Las 5 imágenes empiezan a descargarse
   desde que se abre la página.

   Así foto1, foto2 y foto5 no tienen
   que esperar recién cuando llega
   su página.
*/

const fotosPrecargadas = [];

CONFIG.recuerdos.forEach((recuerdo,index)=>{

    if(!recuerdo.foto){
        return;
    }

    const imagen =
        new Image();

    imagen.src =
        recuerdo.foto;

    fotosPrecargadas[index] =
        imagen;

});


/* ================================================= */
/* DATOS INICIALES */
/* ================================================= */

$("titulo").textContent =
    CONFIG.titulo;

$("dedicatoria").textContent =
    CONFIG.dedicatoria;

$("secreto").textContent =
    CONFIG.sorpresa;


/* ================================================= */
/* MOSTRAR FOTO */
/* ================================================= */

function mostrarFoto(recuerdo){

    const foto =
        $("foto");

    const marco =
        $("marco");

    const ilustracion =
        $("ilustracion");


    /*
       Ocultamos el marco mientras
       esperamos la imagen.
    */

    marco.classList.remove("lista");

    marco.classList.add("cargando");


    foto.onload = null;

    foto.onerror = null;


    foto.removeAttribute("src");

    foto.hidden = true;


    ilustracion.hidden = true;


    foto.alt =
        recuerdo.descripcion;


    if(!recuerdo.foto){

        ilustracion.hidden = false;

        marco.classList.remove("cargando");

        marco.classList.add("lista");

        return;

    }


    /*
       Revisamos si la imagen ya fue
       cargada anteriormente.
    */

    const imagenPrecargada =
        fotosPrecargadas[
            CONFIG.recuerdos.indexOf(recuerdo)
        ];


    function imagenLista(){

        foto.hidden = false;

        ilustracion.hidden = true;


        /*
           Aplicamos nuevamente la animación.
        */

        foto.className = "";

        void foto.offsetWidth;


        const efectos = [

            "foto-centro",

            "foto-lateral",

            "foto-cortina",

            "foto-giro",

            "foto-album"

        ];


        foto.classList.add(

            efectos[
                CONFIG.recuerdos.indexOf(recuerdo)
                %
                efectos.length
            ]

        );


        /*
           AHORA sí mostramos el marco.

           Primero aparece la imagen
           y después el marco.

           Ya no habrá marco vacío.
        */

        marco.classList.remove("cargando");

        marco.classList.add("lista");

    }


    function imagenError(){

        foto.hidden = true;

        ilustracion.hidden = false;

        marco.classList.remove("cargando");

        marco.classList.add("lista");

    }


    /*
       Si ya está cargada,
       la mostramos inmediatamente.
    */

    if(
        imagenPrecargada &&
        imagenPrecargada.complete &&
        imagenPrecargada.naturalWidth > 0
    ){

        foto.src =
            imagenPrecargada.src;

        imagenLista();

        return;

    }


    /*
       Si todavía está cargando,
       esperamos.
    */

    foto.onload =
        imagenLista;

    foto.onerror =
        imagenError;


    foto.src =
        recuerdo.foto;

}


/* ================================================= */
/* MOSTRAR PÁGINA */
/* ================================================= */

function mostrar(){

    $("avance").style.width =
        (pagina / total * 100) + "%";


    const portada =
        pagina === 0;


    $("portada").hidden =
        !portada;

    $("contenido").hidden =
        portada;


    $("contador").textContent =
        portada
        ?
        "Portada"
        :
        `Página ${pagina} de ${total}`;


    $("secreto").hidden =
        true;


    $("revelar")
        .setAttribute(
            "aria-expanded",
            "false"
        );


    if(portada){

        $("marco").classList.remove("lista");

        $("marco").classList.add("cargando");

        return;

    }


    const final =
        pagina === total;


    $("marco").hidden =
        final;


    $("revelar").hidden =
        true;


    if(final){

        $("marco").classList.remove("lista");

        $("marco").classList.add("cargando");


        $("secreto").hidden =
            false;


        celebrar();


        $("fecha").textContent =
            "Y esto continúa…";


        $("encabezado").textContent =
            "Mi recuerdo favorito es contigo";


        $("texto").textContent =
            "Este libro es una pequeña manera de decirte cuánto significan para mí los momentos que compartimos.";

    }


    else{

        const r =
            CONFIG.recuerdos[
                pagina - 1
            ];


        $("fecha").textContent =
            r.fecha;


        $("encabezado").textContent =
            r.titulo;


        $("texto").textContent =
            r.texto;


        $("pie").textContent =
            r.pie;


        mostrarFoto(r);

    }


    $("numero").textContent =
        String(pagina).padStart(2,"0");


    $("contenido").style.animation =
        "none";


    void $("contenido").offsetWidth;


    $("contenido").style.animation =
        "";

}


/* ================================================= */
/* RECORRIDO */
/* ================================================= */

let temporizador;

let pausado = false;

let historiaIniciada = false;


function programar(){

    clearTimeout(
        temporizador
    );


    if(!historiaIniciada){
        return;
    }


    const final =
        pagina === total;


    $("pausar").hidden =
        final;


    $("reiniciar").hidden =
        !final;


    if(final){

        desvanecerMusica(
            0,
            3500,
            true
        );

        return;

    }


    if(
        pausado ||
        document.hidden
    ){

        return;

    }


    const segundos =
        pagina === 0
        ?
        CONFIG.segundosPortada
        :
        CONFIG.segundosPorPagina;


    temporizador =
        setTimeout(()=>{

            pagina++;

            mostrar();

            programar();

        },Math.max(1,segundos)*1000);

}


/* ================================================= */
/* BOTÓN PAUSAR */
/* ================================================= */

$("pausar").onclick = ()=>{

    pausado =
        !pausado;


    $("pausar").textContent =
        pausado
        ?
        "Continuar recorrido"
        :
        "Pausar recorrido";


    if(pausado){

        desvanecerMusica(
            0,
            1800,
            true
        );

    }

    else{

        reproducirMusica()
            .then(()=>{

                desvanecerMusica(
                    0.35,
                    1800
                );

            });

    }


    programar();

};


/* ================================================= */
/* REINICIAR */
/* ================================================= */

$("reiniciar").onclick = ()=>{

    pagina = 1;

    pausado = false;


    $("pausar").textContent =
        "Pausar recorrido";


    reproducirMusica()
        .then(()=>{

            desvanecerMusica(
                0.35,
                2200
            );

        });


    mostrar();

    programar();

};


/* ================================================= */
/* VISIBILIDAD */
/* ================================================= */

document.addEventListener(
    "visibilitychange",
    programar
);


/* ================================================= */
/* MÚSICA */
/* ================================================= */

const musica =
    $("musica");


musica.volume =
    0.35;


let intervaloVolumen;


function desvanecerMusica(
    volumenFinal,
    duracion = 1800,
    pausarAlFinal = false
){

    clearInterval(
        intervaloVolumen
    );


    const volumenInicial =
        musica.volume;


    const pasos = 30;

    let paso = 0;


    intervaloVolumen =
        setInterval(()=>{

            paso++;


            musica.volume =
                Math.max(
                    0,
                    Math.min(
                        1,
                        volumenInicial +
                        (
                            volumenFinal -
                            volumenInicial
                        )
                        *
                        (
                            paso /
                            pasos
                        )
                    )
                );


            if(paso >= pasos){

                clearInterval(
                    intervaloVolumen
                );


                musica.volume =
                    volumenFinal;


                if(
                    pausarAlFinal &&
                    volumenFinal === 0
                ){

                    musica.pause();

                }

            }

        },duracion / pasos);

}


/* ================================================= */
/* REPRODUCIR MÚSICA */
/* ================================================= */

let audioIniciado =
    false;


async function reproducirMusica(){

    try{

        if(!musica.paused){
            return;
        }


        if(
            musica.volume === 0
        ){

            musica.volume =
                0.01;

        }


        await musica.play();


        audioIniciado =
            true;


        $("estadoMusica").textContent =
            "";


        $("silenciar").hidden =
            false;


        document.removeEventListener(
            "click",
            primerGesto
        );


        document.removeEventListener(
            "touchend",
            primerGesto
        );


        document.removeEventListener(
            "keydown",
            primerGesto
        );

    }

    catch(error){

        if(
            error.name !==
            "NotAllowedError" &&
            error.name !==
            "AbortError"
        ){

            $("estadoMusica").textContent =
                "La canción no está disponible. El libro sigue abierto para ti.";

            console.warn(
                "Comprueba que exista cancion.mp3 y sea un MP3 válido.",
                error
            );

        }

    }

}


/* ================================================= */
/* PRIMER GESTO */
/* ================================================= */

function primerGesto(){

    reproducirMusica();

}


document.addEventListener(
    "click",
    primerGesto
);


document.addEventListener(
    "touchend",
    primerGesto,
    {
        passive:true
    }
);


document.addEventListener(
    "keydown",
    primerGesto
);


/* ================================================= */
/* SILENCIAR */
/* ================================================= */

$("silenciar").onclick = ()=>{

    musica.muted =
        !musica.muted;


    $("silenciar").textContent =
        musica.muted
        ?
        "Restaurar sonido"
        :
        "Silenciar sonido";


    $("silenciar").setAttribute(
        "aria-pressed",
        String(musica.muted)
    );

};


/* ================================================= */
/* INTENTAR REPRODUCIR */
/* ================================================= */

reproducirMusica();


/* ================================================= */
/* ABRIR HISTORIA */
/* ================================================= */

$("abrir").onclick =
    async ()=>{

        musica.volume =
            0.01;


        await reproducirMusica();


        desvanecerMusica(
            0.35,
            2200
        );


        $("inicio")
            .classList
            .add("oculto");


        historiaIniciada =
            true;


        pagina =
            1;


        mostrar();

        programar();

    };


/* ================================================= */
/* MOVIMIENTO REDUCIDO */
/* ================================================= */

const movimientoReducido =
    window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    );


/* ================================================= */
/* PARTICULAS */
/* ================================================= */

if(!movimientoReducido.matches){

    for(
        let i = 0;
        i < 12;
        i++
    ){

        const estrella =
            document.createElement(
                "span"
            );


        estrella.textContent =
            i % 2
            ?
            "♡"
            :
            "✧";


        estrella.style.left =
            (i * 8.5) + "%";


        estrella.style.animationDelay =
            (-i * 1.7) + "s";


        estrella.style.animationDuration =
            (14 + i % 4 * 3) + "s";


        $("particulas")
            .appendChild(
                estrella
            );

    }

}


/* ================================================= */
/* CELEBRACIÓN FINAL */
/* ================================================= */

function celebrar(){

    if(
        movimientoReducido.matches
    ){

        return;

    }


    for(
        let i = 0;
        i < 20;
        i++
    ){

        const c =
            document.createElement(
                "span"
            );


        c.className =
            "destello";


        c.textContent =
            i % 2
            ?
            "♥"
            :
            "✧";


        c.setAttribute(
            "aria-hidden",
            "true"
        );


        c.style.setProperty(
            "--dx",
            (
                Math.random() * 500 -
                250
            ) + "px"
        );


        c.style.setProperty(
            "--dy",
            (
                Math.random() * 400 -
                300
            ) + "px"
        );


        document.body.appendChild(c);


        setTimeout(
            ()=>c.remove(),
            1900
        );

    }

}


/* ================================================= */
/* INICIAR */
/* ================================================= */

mostrar();

</script>
