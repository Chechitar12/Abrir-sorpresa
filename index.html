<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los momentos que guardo contigo</title>

<style>

/* =========================================================
   ESTILOS GENERALES
========================================================= */

:root{
    --papel:#8f1028;
    --tinta:#fff;
    --rosa:#fff;
    --oro:#ffd4dc;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100svh;

    color:#fff;

    font-family:Georgia,serif;

    background:#650b1d;

    background-image:

        radial-gradient(
            circle at 15% 5%,
            #d94560 0,
            transparent 36%
        ),

        radial-gradient(
            circle at 90% 90%,
            #a91535 0,
            transparent 42%
        ),

        linear-gradient(
            145deg,
            #8f1028,
            #420815
        );
}


/* =========================================================
   INICIO
========================================================= */

.inicio{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:

        radial-gradient(
            circle at 50% 15%,
            #df4864 0,
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #a71535,
            #4a0717
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.inicio.oculto{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.inicio-tarjeta{

    width:min(650px,100%);

    padding:55px 35px;

    text-align:center;

    background:#6c0b20d9;

    border:1px solid #fff;

    border-radius:20px;

    box-shadow:

        0 25px 80px #210008a8,

        inset 0 0 45px #ffffff12;
}

.inicio-corazon{

    display:block;

    font-size:65px;

    color:#fff;

    margin-bottom:20px;

    animation:

        latido 1.4s ease-in-out infinite;
}

@keyframes latido{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}


/* =========================================================
   TEXTOS
========================================================= */

header{

    text-align:center;

    font:

        11px Arial,
        sans-serif;

    letter-spacing:4px;

    margin:10px 0 25px;

    color:#fff;

    text-shadow:
        0 2px 8px #35000c;
}

.etiqueta{

    font:

        11px Arial,
        sans-serif;

    letter-spacing:3px;

    text-transform:uppercase;

    margin:20px 0;

    color:#ffe5ea;

    text-shadow:
        0 2px 6px #3d0613;
}

h1{

    font-size:
        clamp(38px,8vw,66px);

    font-weight:normal;

    line-height:1.08;

    max-width:550px;

    margin:15px auto;
}

h2{

    font-size:
        clamp(28px,5vw,40px);

    font-weight:normal;

    margin:15px 0;
}

p{

    line-height:1.7;

    white-space:pre-line;

    font-size:17px;

    max-width:560px;

    margin:16px auto;
}


/* =========================================================
   BOTONES
========================================================= */

button{

    border:0;

    border-radius:30px;

    padding:14px 22px;

    background:#fff;

    color:#8b1430;

    cursor:pointer;

    font:

        15px Arial,
        sans-serif;

    min-height:46px;

    transition:
        transform .2s ease,
        filter .2s ease;
}

button:hover{

    filter:brightness(1.08);

    transform:translateY(-2px);
}

button:focus-visible{

    outline:
        3px solid #d2a84e;

    outline-offset:4px;
}

button:disabled{

    opacity:.4;

    cursor:default;
}


/* =========================================================
   CONTENEDOR PRINCIPAL
========================================================= */

main{

    max-width:850px;

    margin:auto;

    padding:30px 18px;
}

.libro{

    position:relative;

    background:#99152f;

    border:1px solid #ffb9c7;

    border-radius:
        5px 16px 16px 5px;

    box-shadow:

        8px 8px 0 #740d23,

        12px 12px 0 #4d0717,

        0 30px 80px #21000888;

    overflow:hidden;
}

.libro:before{

    content:"";

    position:absolute;

    left:12px;

    top:0;

    bottom:0;

    width:1px;

    background:#ffcad466;

    z-index:1;
}


/* =========================================================
   PÁGINAS
========================================================= */

.pagina{

    position:relative;

    padding:
        34px 30px 28px;

    text-align:center;

    min-height:530px;

    color:#fff;

    background:

        radial-gradient(
            circle at 85% 10%,
            #d13a56 0,
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #a71634,
            #6f0c22
        );

    animation:
        entrada .45s ease;

    transform-origin:left center;
}

[hidden]{
    display:none!important;
}

@keyframes entrada{

    from{

        opacity:0;

        transform:
            perspective(900px)
            rotateY(-8deg);
    }

    to{

        opacity:1;

        transform:none;
    }
}


/* =========================================================
   PORTADA
========================================================= */

.portada{

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:

        radial-gradient(
            circle at 20% 12%,
            #e04c67 0,
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #aa1838,
            #59091c
        );

    color:#fff3df;

    min-height:580px;

    border:12px double #ffd2da;
}

.sello{

    font-size:45px;

    color:#ffd4dc;
}


/* =========================================================
   POLAROID
========================================================= */

.polaroid{

    position:relative;

    background:#fff;

    padding:
        12px 12px 28px;

    box-shadow:
        0 15px 38px #35000c99;

    max-width:560px;

    margin:22px auto;

    transform:rotate(-2deg);

    cursor:pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.polaroid:hover{

    transform:
        rotate(0deg)
        scale(1.01);

    box-shadow:
        0 18px 45px #35000cbb;
}

.polaroid img{

    display:block;

    width:100%;

    aspect-ratio:4/3;

    object-fit:cover;

    object-position:center;

    background:#eee;
}

.pie-foto{

    font-style:italic;

    font-size:14px;

    margin:12px 0 0;

    color:#6d1830;

    text-shadow:none;
}

.ilustracion{

    aspect-ratio:4/3;

    display:grid;

    place-content:center;

    background:
        linear-gradient(
            150deg,
            #d8d6c8,
            #f2dcc9
        );

    color:#71695f;

    font-size:72px;
}


/* =========================================================
   ANIMACIONES DE LAS FOTOS
========================================================= */

.foto-centro{

    animation:
        fotoCentro 1.6s
        cubic-bezier(.2,.7,.2,1)
        both;
}

.foto-lateral{

    animation:
        fotoLateral 1.6s
        cubic-bezier(.2,.7,.2,1)
        both;
}

.foto-cortina{

    animation:
        fotoCortina 1.8s
        ease-in-out
        both;
}

.foto-giro{

    animation:
        fotoGiro 1.8s
        cubic-bezier(.2,.7,.2,1)
        both;
}

.foto-album{

    transform-origin:left center;

    animation:
        fotoAlbum 1.8s
        ease-out
        both;

    backface-visibility:hidden;
}


@keyframes fotoCentro{

    from{

        opacity:0;

        transform:scale(.78);
    }

    to{

        opacity:1;

        transform:scale(1);
    }
}

@keyframes fotoLateral{

    from{

        opacity:0;

        transform:translateX(55px);
    }

    to{

        opacity:1;

        transform:translateX(0);
    }
}

@keyframes fotoCortina{

    from{

        clip-path:inset(0 50%);

        opacity:.4;
    }

    to{

        clip-path:inset(0 0);

        opacity:1;
    }
}

@keyframes fotoGiro{

    from{

        opacity:0;

        transform:
            rotate(-8deg)
            scale(.88);
    }

    to{

        opacity:1;

        transform:
            rotate(0)
            scale(1);
    }
}

@keyframes fotoAlbum{

    from{

        opacity:0;

        transform:
            perspective(1000px)
            rotateY(-78deg);
    }

    to{

        opacity:1;

        transform:
            perspective(1000px)
            rotateY(0);
    }
}


/* =========================================================
   INDICADOR DE PAUSA SOBRE LA FOTO
========================================================= */

.polaroid.pausada::after{

    content:"▶ Continuar";

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    padding:
        12px 20px;

    border-radius:30px;

    background:#6d0b20e8;

    color:#fff;

    font:
        14px Arial,
        sans-serif;

    letter-spacing:.5px;

    box-shadow:
        0 5px 20px #35000c99;

    pointer-events:none;
}


/* =========================================================
   NAVEGACIÓN / CONTADOR
========================================================= */

#contador{

    font:
        12px Arial,
        sans-serif;

    color:#fff;

    text-align:center;

    text-shadow:
        0 2px 6px #35000c;
}

.progreso{

    width:100%;

    height:5px;

    margin-top:25px;

    background:#ffffff3d;

    border-radius:10px;

    overflow:hidden;
}

.progreso span{

    display:block;

    height:100%;

    width:0%;

    background:#fff;

    transition:
        width .4s ease;
}

.nota{

    text-align:center;

    color:#fff;

    font:
        12px Arial,
        sans-serif;

    margin:25px 0;

    text-shadow:
        0 2px 6px #35000c;
}


/* =========================================================
   SECRETO
========================================================= */

.secreto{

    padding:20px;

    border:1px dashed #ffd2da;

    border-radius:8px;

    margin-top:20px;

    background:#ffffff18;

    color:#fff!important;
}

.numero{

    font:
        11px Arial,
        sans-serif;

    color:#fff;

    letter-spacing:2px;

    margin-top:28px;

    text-shadow:
        0 2px 6px #3d0613;
}


/* =========================================================
   PÁGINA FINAL
========================================================= */

.pagina.final{

    min-height:650px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding-top:35px;

    overflow:hidden;
}

.final .etiqueta{

    margin-bottom:5px;
}


/* =========================================================
   GIRASOLES
========================================================= */

.girasoles{

    position:relative;

    width:min(560px,100%);

    height:330px;

    margin:
        5px auto 5px;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    gap:8px;

    overflow:visible;
}


/* Cada girasol */

.girasol{

    position:relative;

    width:120px;

    height:300px;

    opacity:0;

    transform:
        translateY(70px)
        scale(.3);

    animation:
        formarGirasol 1.8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

.girasol:nth-child(1){
    animation-delay:.1s;
}

.girasol:nth-child(2){
    animation-delay:.35s;
}

.girasol:nth-child(3){
    animation-delay:.6s;
}

.girasol:nth-child(4){
    animation-delay:.85s;
}

.girasol:nth-child(5){
    animation-delay:1.1s;
}

.girasol:nth-child(6){
    animation-delay:1.35s;
}

.girasol:nth-child(7){
    animation-delay:1.6s;
}

@keyframes formarGirasol{

    0%{

        opacity:0;

        transform:
            translateY(70px)
            scale(.3);
    }

    60%{

        opacity:1;

        transform:
            translateY(-10px)
            scale(1.08);
    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* Tallo */

.tallo{

    position:absolute;

    bottom:0;

    left:50%;

    width:7px;

    height:190px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to right,
            #28551d,
            #4f8b35,
            #28551d
        );

    border-radius:10px;
}


/* Hoja izquierda */

.hoja{

    position:absolute;

    width:55px;

    height:25px;

    background:#4f8b35;

    border-radius:
        100% 0 100% 0;

    transform-origin:right center;
}

.hoja.izquierda{

    left:calc(50% - 48px);

    bottom:75px;

    transform:
        rotate(25deg);
}

.hoja.derecha{

    right:calc(50% - 48px);

    bottom:115px;

    transform:
        rotate(155deg);
}


/* Cabeza del girasol */

.cabeza{

    position:absolute;

    left:50%;

    top:0;

    width:105px;

    height:105px;

    transform:
        translateX(-50%);

    border-radius:50%;

    animation:
        girarCabeza 1.8s
        ease-out both;
}

@keyframes girarCabeza{

    from{
        transform:
            translateX(-50%)
            rotate(-35deg);
    }

    to{
        transform:
            translateX(-50%)
            rotate(0);
    }
}


/* Pétalos */

.petalo{

    position:absolute;

    left:50%;

    top:50%;

    width:34px;

    height:58px;

    margin-left:-17px;

    margin-top:-29px;

    background:
        linear-gradient(
            to bottom,
            #ffd94a,
            #f2a900
        );

    border-radius:
        50% 50% 45% 45%;

    transform-origin:center 50px;

    box-shadow:
        0 2px 4px #5b320044;
}


/* 8 pétalos */

.petalo:nth-child(1){
    transform:rotate(0deg);
}

.petalo:nth-child(2){
    transform:rotate(45deg);
}

.petalo:nth-child(3){
    transform:rotate(90deg);
}

.petalo:nth-child(4){
    transform:rotate(135deg);
}

.petalo:nth-child(5){
    transform:rotate(180deg);
}

.petalo:nth-child(6){
    transform:rotate(225deg);
}

.petalo:nth-child(7){
    transform:rotate(270deg);
}

.petalo:nth-child(8){
    transform:rotate(315deg);
}


/* Centro marrón */

.centro{

    position:absolute;

    left:50%;

    top:50%;

    width:42px;

    height:42px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #5c3015 0,
            #7c4419 45%,
            #3e200d 100%
        );

    box-shadow:
        inset 0 0 0 4px #4c280f55;
}


/* =========================================================
   MENSAJE FINAL
========================================================= */

.mensaje-final{

    position:relative;

    z-index:10;

    width:min(600px,100%);

    margin:
        0 auto;

    padding:
        5px 20px 20px;

    text-align:center;
}

.mensaje-final h2{

    margin:
        0 0 12px;

    font-size:
        clamp(28px,5vw,42px);

    color:#fff;

    text-shadow:
        0 3px 10px #3d0613;
}

.mensaje-final p{

    margin:
        8px auto;

    font-size:17px;

    line-height:1.7;

    color:#fff;

    text-shadow:
        0 2px 7px #3d0613;
}

.continuara{

    margin-top:18px!important;

    font-size:20px!important;

    font-style:italic;

    color:#ffd4dc!important;

    letter-spacing:2px;

    text-shadow:
        0 2px 8px #3d0613;
}


/* =========================================================
   PARTÍCULAS
========================================================= */

.particulas{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:5;

    overflow:hidden;
}

.particulas span{

    position:absolute;

    top:-30px;

    color:#ffffff38;

    animation:
        caer linear forwards;
}

@keyframes caer{

    to{

        transform:
            translateY(110vh)
            rotate(360deg);

        opacity:0;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    .pagina{

        padding:
            30px 20px;

        min-height:600px;
    }

    .pagina.final{

        min-height:680px;
    }

    .girasoles{

        width:100%;

        height:300px;

        gap:0;
    }

    .girasol{

        width:80px;

        height:275px;

        transform:
            translateY(70px)
            scale(.8);
    }

    .cabeza{

        width:80px;

        height:80px;
    }

    .petalo{

        width:27px;

        height:48px;

        margin-left:-13.5px;

        margin-top:-24px;

        transform-origin:center 42px;
    }

    .centro{

        width:32px;

        height:32px;
    }

    .tallo{

        height:180px;
    }

    .hoja{

        width:45px;

        height:22px;
    }
}


@media(max-width:520px){

    main{

        padding:
            18px 14px;
    }

    .pagina{

        padding:
            26px 18px;

        min-height:530px;
    }

    .portada{

        min-height:550px;
    }

    .inicio-tarjeta{

        padding:
            45px 22px;
    }

    .girasoles{

        height:280px;
    }

    .girasol{

        width:65px;

        height:255px;

        transform:
            translateY(70px)
            scale(.68);
    }

    .girasol:nth-child(1),
    .girasol:nth-child(7){

        display:none;
    }

    .mensaje-final{

        padding:
            0 8px 15px;
    }

}


/* =========================================================
   REDUCIR ANIMACIONES
========================================================= */

@media(prefers-reduced-motion:reduce){

    .pagina,
    .girasol,
    .cabeza,
    .inicio-corazon{

        animation:none;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     PANTALLA DE INICIO
======================================================= -->

<div class="inicio" id="inicio">

    <div class="inicio-tarjeta">

        <span
            class="inicio-corazon"
            aria-hidden="true">
            ♥
        </span>

        <div class="etiqueta">
            Una sorpresa hecha para ti
        </div>

        <h1>
            Los momentos que guardo contigo
        </h1>

        <button id="abrir">
            Abrir nuestra historia
        </button>

    </div>

</div>


<!-- =======================================================
     PARTÍCULAS
======================================================= -->

<div
    class="particulas"
    id="particulas"
    aria-hidden="true">
</div>


<!-- =======================================================
     MÚSICA
======================================================= -->

<audio
    id="musica"
    loop
    preload="auto">

    <source
        src="cancion.mp3"
        type="audio/mpeg">

</audio>


<!-- =======================================================
     CONTENIDO
======================================================= -->

<main>

    <p
        id="estadoMusica"
        role="status"
        style="
            font:13px Arial,sans-serif;
            text-align:center;
        ">
    </p>


    <header>
        HECHO DE PEQUEÑOS GRANDES MOMENTOS
    </header>


    <div
        class="libro"
        id="libro">


        <!-- =================================================
             PORTADA
        ================================================== -->

        <section
            class="pagina portada"
            id="portada"
            aria-label="Portada">

            <div
                class="sello"
                aria-hidden="true">
                ✧
            </div>

            <div class="etiqueta">
                Una historia para guardar
            </div>

            <h1 id="titulo"></h1>

            <p id="dedicatoria"></p>

            <p class="etiqueta">
                Nuestra historia está por comenzar…
            </p>

        </section>


        <!-- =================================================
             CONTENIDO
        ================================================== -->

        <section
            class="pagina"
            id="contenido"
            hidden
            aria-label="Página del libro">


            <div
                class="etiqueta"
                id="fecha">
            </div>


            <h2
                id="encabezado"
                tabindex="-1">
            </h2>


            <!-- FOTO -->

            <figure
                class="polaroid"
                id="marco">


                <img
                    id="foto"
                    alt=""
                    hidden>


                <div
                    class="ilustracion"
                    id="ilustracion"
                    aria-hidden="true">

                    ✿

                </div>


                <figcaption
                    class="pie-foto"
                    id="pie">
                </figcaption>


            </figure>


            <p id="texto"></p>


            <button
                id="revelar"
                hidden>

                Hay algo más para ti… 💌

            </button>


            <p
                id="secreto"
                class="secreto"
                hidden>
            </p>


            <div
                class="numero"
                id="numero">
            </div>


            <!-- =============================================
                 GIRASOLES DE LA ÚLTIMA PÁGINA
            ============================================== -->

            <div
                class="girasoles"
                id="girasoles"
                hidden>
            </div>


            <!-- =============================================
                 MENSAJE FINAL
            ============================================== -->

            <div
                class="mensaje-final"
                id="mensajeFinal"
                hidden>

                <h2>
                    Para ti ♥
                </h2>

                <p id="sorpresaFinal"></p>

                <p class="continuara">
                    Continuará…
                </p>

            </div>


        </section>


    </div>


    <!-- ===================================================
         PROGRESO
    ==================================================== -->

    <div
        class="progreso"
        aria-hidden="true">

        <span id="avance"></span>

    </div>


    <!-- ===================================================
         CONTADOR
    ==================================================== -->

    <div
        style="
            text-align:center;
            margin-top:22px;
        ">

        <span
            id="contador"
            role="status"
            aria-live="polite">

            Portada

        </span>

        <br>

        <button
            id="reiniciar"
            hidden>

            Volver a ver nuestra historia ↺

        </button>

    </div>


    <p class="nota">
        Las páginas avanzan solas. Disfruta nuestra historia.
    </p>


    <noscript>

        Activa JavaScript en tu navegador
        para abrir el libro.

    </noscript>


</main>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const CONFIG = {

    /* La portada dura 4 segundos */

/* =========================================================
   ELEMENTOS
========================================================= */

const inicio =
    document.getElementById("inicio");

const abrir =
    document.getElementById("abrir");

const musica =
    document.getElementById("musica");

const portada =
    document.getElementById("portada");

const contenido =
    document.getElementById("contenido");

const titulo =
    document.getElementById("titulo");

const dedicatoria =
    document.getElementById("dedicatoria");

const fecha =
    document.getElementById("fecha");

const encabezado =
    document.getElementById("encabezado");

const foto =
    document.getElementById("foto");

const marco =
    document.getElementById("marco");

const ilustracion =
    document.getElementById("ilustracion");

const pie =
    document.getElementById("pie");

const texto =
    document.getElementById("texto");

const numero =
    document.getElementById("numero");

const contador =
    document.getElementById("contador");

const avance =
    document.getElementById("avance");

const reiniciar =
    document.getElementById("reiniciar");

const girasoles =
    document.getElementById("girasoles");

const mensajeFinal =
    document.getElementById("mensajeFinal");

const sorpresaFinal =
    document.getElementById("sorpresaFinal");


/* =========================================================
   VARIABLES
========================================================= */

let paginaActual = -1;

let temporizador = null;

let pausado = false;

let musicaIniciada = false;


/* =========================================================
   PREPARAR PORTADA
========================================================= */

titulo.textContent =
    CONFIG.titulo;

dedicatoria.textContent =
    CONFIG.dedicatoria;


/* =========================================================
   ANIMACIÓN DE PARTÍCULAS
========================================================= */

function crearParticulas(){

    const contenedor =
        document.getElementById("particulas");

    const simbolos = [
        "♥",
        "✦",
        "♡",
        "✧"
    ];

    for(
        let i=0;
        i<25;
        i++
    ){

        const span =
            document.createElement("span");

        span.textContent =
            simbolos[
                Math.floor(
                    Math.random() *
                    simbolos.length
                )
            ];

        span.style.left =
            Math.random()*100 + "%";

        span.style.fontSize =
            (10 +
            Math.random()*18) + "px";

        span.style.animationDuration =
            (7 +
            Math.random()*8) + "s";

        span.style.animationDelay =
            (Math.random()*8) + "s";

        contenedor.appendChild(span);
    }
}


/* =========================================================
   MÚSICA
========================================================= */

async function iniciarMusica(){

    if(musicaIniciada){
        return;
    }

    try{

        musica.volume = 0.35;

        await musica.play();

        musicaIniciada = true;

        document.getElementById(
            "estadoMusica"
        ).textContent = "";

    }catch(error){

        document.getElementById(
            "estadoMusica"
        ).textContent =
            "Pulsa nuevamente para iniciar la música.";

    }
}


/* =========================================================
   ABRIR HISTORIA
========================================================= */

abrir.addEventListener(
    "click",
    async function(){

        await iniciarMusica();

        inicio.classList.add("oculto");

        mostrar(-1);

    }
);


/* =========================================================
   MOSTRAR PÁGINA
========================================================= */

function mostrar(indice){

    clearTimeout(temporizador);

    paginaActual =
        indice;

    pausado = false;

    marco.classList.remove("pausada");

    /* ---------------------------------------------
       PORTADA
    --------------------------------------------- */

    if(indice === -1){

        portada.hidden = false;

        contenido.hidden = true;

        contador.textContent =
            "Portada";

        avance.style.width =
            "0%";

        temporizador =
            setTimeout(
                ()=>{
                    mostrar(0);
                },
                CONFIG.segundosPortada * 1000
            );

        return;
    }


    /* ---------------------------------------------
       PÁGINA FINAL
    --------------------------------------------- */

    if(indice >= CONFIG.recuerdos.length){

        mostrarFinal();

        return;
    }


    /* ---------------------------------------------
       PÁGINA DE FOTO
    --------------------------------------------- */

    portada.hidden = true;

    contenido.hidden = false;

    contenido.classList.remove("final");

    girasoles.hidden = true;

    mensajeFinal.hidden = true;

    marco.hidden = false;

    foto.hidden = false;

    ilustracion.hidden = true;

    const recuerdo =
        CONFIG.recuerdos[indice];


    fecha.textContent =
        recuerdo.fecha;

    encabezado.textContent =
        recuerdo.titulo;

    texto.textContent =
        recuerdo.texto;

    pie.textContent =
        recuerdo.pie;

    numero.textContent =
        `Página ${indice + 1} de ${CONFIG.recuerdos.length}`;


    foto.alt =
        recuerdo.descripcion;

    foto.src =
        recuerdo.foto;


    /* Animaciones diferentes */

    const animaciones = [
        "foto-centro",
        "foto-lateral",
        "foto-cortina",
        "foto-giro",
        "foto-album"
    ];

    animaciones.forEach(
        clase=>{
            foto.classList.remove(clase);
        }
    );


    /* Reiniciar animación */

    void foto.offsetWidth;


    foto.classList.add(
        animaciones[
            indice %
            animaciones.length
        ]
    );


    contador.textContent =
        `Página ${indice + 1} de ${CONFIG.recuerdos.length}`;


    const porcentaje =
        ((indice + 1) /
        CONFIG.recuerdos.length) * 100;

    avance.style.width =
        porcentaje + "%";


    /* ---------------------------------------------
       ESPERAR 15 SEGUNDOS
    --------------------------------------------- */

    temporizador =
        setTimeout(
            ()=>{
                if(!pausado){
                    mostrar(indice + 1);
                }
            },
            CONFIG.segundosPorPagina * 1000
        );
}


/* =========================================================
   MOSTRAR PÁGINA FINAL
========================================================= */

function mostrarFinal(){

    clearTimeout(temporizador);

    portada.hidden = true;

    contenido.hidden = false;

    contenido.classList.add("final");

    marco.hidden = true;

    ilustracion.hidden = true;

    fecha.textContent =
        "Una última página";

    encabezado.textContent =
        "";

    texto.textContent =
        "";

    numero.textContent =
        "";

    contador.textContent =
        "Continuará…";

    avance.style.width =
        "100%";

    /* Mostrar girasoles */

    girasoles.hidden = false;

    mensajeFinal.hidden = false;

    sorpresaFinal.textContent =
        CONFIG.sorpresa;

    formarGirasoles();

    reiniciar.hidden = false;

    crearConfetiFinal();
}


/* =========================================================
   CREAR GIRASOLES
========================================================= */

function formarGirasoles(){

    girasoles.innerHTML = "";

    for(
        let i=0;
        i<7;
        i++
    ){

        const girasol =
            document.createElement("div");

        girasol.className =
            "girasol";


        /* Tallo */

        const tallo =
            document.createElement("div");

        tallo.className =
            "tallo";


        /* Hojas */

        const hojaIzq =
            document.createElement("div");

        hojaIzq.className =
            "hoja izquierda";


        const hojaDer =
            document.createElement("div");

        hojaDer.className =
            "hoja derecha";


        /* Cabeza */

        const cabeza =
            document.createElement("div");

        cabeza.className =
            "cabeza";


        /* Pétalos */

        for(
            let j=0;
            j<8;
            j++
        ){

            const petalo =
                document.createElement("div");

            petalo.className =
                "petalo";

            cabeza.appendChild(
                petalo
            );
        }


        /* Centro */

        const centro =
            document.createElement("div");

        centro.className =
            "centro";

        cabeza.appendChild(
            centro
        );


        /* Armar girasol */

        girasol.appendChild(
            tallo
        );

        girasol.appendChild(
            hojaIzq
        );

        girasol.appendChild(
            hojaDer
        );

        girasol.appendChild(
            cabeza
        );

        girasoles.appendChild(
            girasol
        );
    }
}


/* =========================================================
   AL HACER CLIC EN LA FOTO
   PAUSA / CONTINÚA
========================================================= */

marco.addEventListener(
    "click",
    function(){

        /* Solo funciona en páginas con foto */

        if(
            paginaActual < 0 ||
            paginaActual >= CONFIG.recuerdos.length
        ){

            return;
        }


        if(!pausado){

            /* PAUSAR */

            pausado = true;

            clearTimeout(
                temporizador
            );

            marco.classList.add(
                "pausada"
            );

        }else{

            /* CONTINUAR */

            pausado = false;

            marco.classList.remove(
                "pausada"
            );


            temporizador =
                setTimeout(
                    ()=>{
                        mostrar(
                            paginaActual + 1
                        );
                    },
                    CONFIG.segundosPorPagina * 1000
                );
        }

    }
);


/* =========================================================
   REINICIAR
========================================================= */

reiniciar.addEventListener(
    "click",
    function(){

        reiniciar.hidden = true;

        mostrar(-1);

    }
);


/* =========================================================
   CONFETI FINAL
========================================================= */

        span.style.fontSize =
            (10 +
            Math.random()*15) + "px";

        span.style.animationDuration =
            (4 +
            Math.random()*5) + "s";

        span.style.animationDelay =
            (Math.random()*3) + "s";

        contenedor.appendChild(
            span
        );
    }
}


/* =========================================================
   PRE-CARGAR FOTOGRAFÍAS
========================================================= */

CONFIG.recuerdos.forEach(
    recuerdo=>{

        const img =
            new Image();

        img.src =
            recuerdo.foto;

    }
);


/* =========================================================
   PARTÍCULAS INICIALES
========================================================= */

crearParticulas();


/* =========================================================
   VISIBILIDAD DE LA PÁGINA
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden
        ){

            clearTimeout(
                temporizador
            );

        }

    }
);

</script>
